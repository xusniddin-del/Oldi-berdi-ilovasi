<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Oldi-Berdi · Admin</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#eef4f0;--surface:#fff;--surface-2:#f3f7f4;--surface-3:#e8f0eb;--fg:#0e2a1b;--muted:#5d7466;--faint:#8aa094;--line:#dfe9e2;
  --brand:#13894a;--brand-deep:#0b5c33;--brand-ink:#0a3f24;--lime:#bff26f;--on-brand:#fff;
  --pos:#119a55;--pos-bg:#e2f5e9;--neg:#d9502f;--neg-bg:#fdece6;--warn:#b77d00;--warn-bg:#fff3d6;
  --plum:#7b56c9;--plum-bg:#efe9fb;--teal:#0f8f8a;--teal-bg:#e0f4f3;--sky:#1c8fca;--sky-bg:#e3f2fb;
  --side:#0b2a1a;--side-fg:#d6eadc;--side-muted:#8fb39c;
  --shadow:0 1px 2px rgba(11,60,33,.05),0 8px 24px -14px rgba(11,60,33,.25);
  --r:18px;--font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark{
  --bg:#07140c;--surface:#0f2217;--surface-2:#13291c;--surface-3:#183323;--fg:#e6f4ea;--muted:#93b19e;--faint:#6f8f7b;--line:#1e3a29;
  --brand:#2bbd6b;--brand-deep:#1b8b4c;--brand-ink:#c9f0d6;--on-brand:#04130a;
  --pos:#3ccf7d;--pos-bg:#123323;--neg:#ff7b5c;--neg-bg:#3a1a12;--warn:#f0b43a;--warn-bg:#332710;
  --plum:#b294ff;--plum-bg:#251c3d;--teal:#3fd0c9;--teal-bg:#0f2f2e;--sky:#5cc0f0;--sky-bg:#0f2a38;
  --side:#050f09;--side-fg:#d6eadc;--side-muted:#7fa08b;--shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- layout ---------- */
.shell{min-height:100vh}
.side{display:none}
.main{max-width:640px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:12px 2px 10px;margin:0 -2px}
.top .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(150deg,#22b35f,#0b5c33);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 6px 14px -8px rgba(11,92,51,.8)}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.top .t small{font-size:12px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.icon-btn:active{transform:scale(.96)}
.icon-btn.spin svg{animation:sp .8s linear infinite}
.me{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--pos-bg);color:var(--brand)}
h1.page{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:8px 2px 2px}
.page-sub{color:var(--muted);font-size:13.5px;margin:0 2px 14px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec h2{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.sec .lnk{font-size:13px;font-weight:700;color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}

/* bottom nav (telefon) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav .in{display:flex;max-width:640px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;font-weight:700;color:var(--faint);border-radius:12px;position:relative}
.nav button .bub{width:46px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.nav button.on{color:var(--brand)}
.nav button.on .bub{background:var(--pos-bg)}
.nav .cnt{position:absolute;top:2px;left:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--neg);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px 14px 12px;position:relative;overflow:hidden}
.kpi .kh{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:700}
.kpi .kh .ki{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.kpi .kh .ki svg{width:16px;height:16px}
.kpi b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:8px;line-height:1.1}
.kpi b small{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:3px}
.kpi .kf{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.delta{font-weight:800;font-size:12px;padding:2px 7px;border-radius:99px}
.delta.up{background:var(--pos-bg);color:var(--pos)}.delta.down{background:var(--neg-bg);color:var(--neg)}.delta.eq{background:var(--surface-2);color:var(--muted)}
.spark{position:absolute;right:10px;bottom:10px;opacity:.9}
.k-brand .ki{background:var(--pos-bg);color:var(--brand)}.k-sky .ki{background:var(--sky-bg);color:var(--sky)}.k-plum .ki{background:var(--plum-bg);color:var(--plum)}.k-warn .ki{background:var(--warn-bg);color:var(--warn)}
.hero-k{grid-column:1/-1;background:linear-gradient(140deg,#0b5c33,#13894a 60%,#22a35a);color:#fff;border:0;padding:18px}
.hero-k .kh{color:rgba(255,255,255,.8)}
.hero-k .kh .ki{background:rgba(255,255,255,.16);color:#fff}
.hero-k b{font-size:32px}
.hero-k b small{color:rgba(255,255,255,.75)}
.hero-k .kf{color:rgba(255,255,255,.85)}
.hero-k .delta.up{background:rgba(191,242,111,.22);color:var(--lime)}.hero-k .delta.down{background:rgba(255,255,255,.16);color:#ffd6cb}.hero-k .delta.eq{background:rgba(255,255,255,.14);color:#fff}
.hero-k .split{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
.hero-k .split div{flex:1}.hero-k .split small{display:block;font-size:12px;opacity:.8}.hero-k .split strong{font-size:17px;font-weight:800}

/* attention */
.att{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.att:last-child{border-bottom:0}
.att .ai{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.att .mid{flex:1;min-width:0}
.att .t1{font-weight:700}
.att .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .n{font-weight:800;font-size:18px}
.att svg.chev{color:var(--faint);width:18px;height:18px}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.qa button span{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.qa button:active{transform:scale(.97)}

/* charts */
.chart{padding:14px 14px 8px}
.chart .ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.chart .ch b{font-weight:800}
.chart .ch small{color:var(--muted);font-size:12px}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--faint);font-size:10px;font-family:var(--font)}
.charts2{display:grid;gap:10px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:14px}
.legend button{display:flex;align-items:center;gap:8px;font-size:13.5px;text-align:left}
.legend button b{margin-left:auto;font-weight:800}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.c-free{background:#a9bdb1}.c-trial{background:#e0a21a}.c-prem{background:var(--brand)}.c-biz{background:var(--plum)}

/* ---------- lists ---------- */
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.mid{flex:1;min-width:0}
.t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;flex:none;letter-spacing:.01em;white-space:nowrap}
.tag.free{background:var(--surface-2);color:var(--muted)}.tag.trial{background:var(--warn-bg);color:var(--warn)}.tag.prem{background:var(--pos-bg);color:var(--brand)}.tag.biz{background:var(--plum-bg);color:var(--plum)}
.tag.paid{background:var(--pos-bg);color:var(--pos)}.tag.other{background:var(--surface-2);color:var(--muted)}.tag.tg{background:var(--sky-bg);color:var(--sky)}
.rcol{text-align:right;flex:none}
.rcol .t2{margin-top:3px}
.ucols{display:none}

.toolbar{position:sticky;top:62px;z-index:12;background:var(--bg);padding:2px 0 8px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px;color:var(--faint)}
.search:focus-within{border-color:var(--brand)}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0;color:var(--fg)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 1px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{opacity:.65;font-weight:600}
.sortbar{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 8px;font-size:12.5px;color:var(--muted)}
.sortbar select{border:0;background:none;font-weight:700;color:var(--fg);font-size:13px;outline:none;cursor:pointer}

/* ---------- settings ---------- */
.feat{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.feat:last-child{border-bottom:0}
.fic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.fic svg{width:20px;height:20px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{padding:7px 10px;border-radius:9px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.m-off{color:var(--neg)}.seg button.on.m-free{color:var(--teal)}.seg button.on.m-prem{color:var(--brand)}
.feat.wrap .seg{flex:1 1 100%;margin-left:52px}.feat.wrap .seg button{flex:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.inp{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);padding:0 13px;font-size:16px;outline:none;color:var(--fg)}
.inp:focus{border-color:var(--brand);background:var(--surface)}
textarea.inp{height:auto;min-height:130px;padding:12px 13px;resize:vertical;line-height:1.45}
.mtag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--surface-2,#eef3ef);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap}.mtag.biz{background:var(--plum-bg);color:var(--plum)}
.modes2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modes2 button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:1px solid var(--line);background:none;font:inherit;color:inherit;cursor:pointer;text-align:left}.modes2 span{font-size:24px}.modes2 small{display:block;color:var(--muted);font-size:12px}.modes2 b{font-size:20px}
.sv-res{margin-bottom:10px}.sv-rq{display:flex;gap:8px;align-items:flex-start;font-weight:700;margin-bottom:10px;line-height:1.35}.sv-n{width:24px;height:24px;border-radius:8px;background:var(--pos-bg);color:var(--brand);display:inline-grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.sv-bar{margin-bottom:8px}.sv-bl{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:3px}.sv-bt{height:8px;border-radius:9px;background:var(--surface-2,#eef3ef);overflow:hidden}.sv-bt i{display:block;height:100%;background:var(--brand);border-radius:9px}
.sv-hist{display:flex;gap:4px;align-items:flex-end;height:110px;padding-top:16px}.sv-hist>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}.sv-hist i{width:100%;min-height:2px;background:var(--brand);border-radius:6px 6px 2px 2px}.sv-hist i.r{background:var(--neg,#d6452a)}.sv-hist i.y{background:var(--warn,#e0a100)}.sv-hist i.g{background:var(--brand)}.sv-hist span{font-size:11px;color:var(--muted);margin-top:4px}.sv-hist b{position:absolute;top:0;font-size:11px}
.sv-txt{padding:8px 10px;border-radius:10px;background:var(--surface-2,#eef3ef);margin-bottom:6px;font-size:13.5px;line-height:1.4}.sv-txt small{display:block;color:var(--muted);margin-top:2px}
.sv-link{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 12px;border-radius:12px;background:var(--surface-2,#eef3ef);font-size:13px}.sv-link span{flex:1;overflow-wrap:anywhere}
.sv-sms{white-space:pre-line;font-size:13.5px}
.sv-a{padding:9px 0;border-bottom:1px solid var(--line)}.sv-a small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.lv4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.lv4 button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card,#fff);font:inherit;color:inherit;cursor:pointer;text-align:left;min-width:0}.lv4 span{font-size:20px}.lv4 small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lv4 b{font-size:18px}
@media (max-width:520px){.lv4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{border:1px solid var(--line);background:var(--card,#fff);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.lcfg{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.lcfg label{font-size:12.5px}
.mtag.prio{background:#fff4d6;color:#7a5300}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sh-h b{font-size:18px}
code{font-size:12px;background:var(--surface-2,#eef3ef);padding:1px 4px;border-radius:5px}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.price-grid .field{margin:0}
.unit{position:relative}.unit .inp{padding-right:54px}.unit::after{content:"so'm";position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);font-weight:700}
.save-note{display:flex;gap:8px;align-items:center;background:var(--pos-bg);color:var(--brand-ink);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin:12px 0}
html.dark .save-note{color:var(--pos)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 16px;border-radius:13px;font-weight:800;font-size:14.5px;white-space:nowrap;text-decoration:none;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn-danger{background:var(--neg-bg);color:var(--neg)}
.btn-sky{background:var(--sky);color:#fff}
.btn-sm{height:38px;padding:0 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.5;pointer-events:none}
.w100{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 .btn{padding:0 4px;font-size:12.5px}

/* ---------- drawer / sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(3,15,8,.45);z-index:40;opacity:0;transition:opacity .2s}
.sheet-bg.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:41;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:8px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet-in{max-width:600px;margin:0 auto}
.uhead{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:10px}
.uhead .ava{width:58px;height:58px;font-size:20px}
.uhead h3{font-size:19px;font-weight:800;letter-spacing:-.01em}
.uhead .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.uacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.uacts .btn{height:auto;padding:10px 4px;flex-direction:column;gap:5px;font-size:12px;border-radius:14px}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;padding:9px 8px;border-radius:10px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.kv small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.kv b{font-size:15px;font-weight:800}
.plan{padding:14px;margin-bottom:10px}
.plan .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.plan .ph b{font-weight:800;display:flex;align-items:center;gap:8px}
.plan .ph small{color:var(--muted);font-size:12.5px;text-align:right}
.custom{display:flex;gap:8px;margin-top:8px}
.custom .inp{height:38px;font-size:14px;border-radius:11px}
.hint{font-size:12.5px;color:var(--muted)}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.2s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--muted);padding:30px 16px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.center{min-height:85vh;display:grid;place-items:center;text-align:center;padding:24px}
.center .ic{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;margin:0 auto 14px;background:var(--surface);border:1px solid var(--line);font-size:32px}
.center h2{font-size:20px;font-weight:800;margin-bottom:6px}
.center p{color:var(--muted);max-width:340px;margin:0 auto}
.idbox{margin-top:16px;display:inline-flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.bubble{background:var(--sky-bg);border-radius:16px 16px 16px 4px;padding:11px 13px;font-size:14px;white-space:pre-wrap;word-break:break-word;min-height:44px}
.bubble b{color:var(--sky);display:block;font-size:12.5px;margin-bottom:2px}
.aud{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aud button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.aud button b{font-size:13.5px}.aud button small{font-size:12px;color:var(--muted)}
.aud button.on{border-color:var(--brand);background:var(--pos-bg)}
.pay-amt{font-weight:800;white-space:nowrap}

/* ---------- katta ekran (Telegram Desktop) ---------- */

  .side nav{display:flex;flex-direction:column;gap:3px}
  .side nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--side-muted);text-align:left}
  .side nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .side nav button.on{background:rgba(191,242,111,.12);color:var(--lime)}
  .side nav .cnt{margin-left:auto;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:99px;color:#fff}
  .side .foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08)}

  .main{max-width:1120px;margin:0 0 0 236px;padding:0 32px 40px}

  .toolbar{top:66px}

  .hero-k{grid-column:span 2}
  .dash{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
  .dash>div,.set2>div,.msg2>div{min-width:0}
  .dash .ucols{display:none}
  .feat.wrap{flex-wrap:nowrap}.feat.wrap .seg{flex:none;margin-left:0}.feat.wrap .seg button{flex:none}

<body>
<div id="app"><div class="center"><div><div class="spin"></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const tg=window.Telegram&&Telegram.WebApp;
const API_URL=String(window.OLDIBERDI_API||'').trim();
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const MON=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
const MONF=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];
const fdate=s=>{if(!s)return '';if(s==='ha')return 'muddatsiz';const p=String(s).split('-');return p.length===3?`${+p[2]}-${MON[+p[1]-1]} ${p[0]}`:s};
const fdt=ms=>{if(!ms)return '—';const d=new Date(+ms);return `${d.getDate()}-${MON[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const ago=ms=>{if(!ms)return '—';const m=Math.round((Date.now()-ms)/6e4);if(m<2)return 'hozir';if(m<60)return m+' daq oldin';const h=Math.round(m/60);if(h<24)return h+' soat oldin';const d=Math.round(h/24);if(d<31)return d+' kun oldin';const mo=Math.round(d/30);return mo<12?mo+' oy oldin':Math.round(mo/12)+' yil oldin'};
const fphone=p=>{p=String(p||'');return p.length===12?`+${p.slice(0,3)} ${p.slice(3,5)} ${p.slice(5,8)} ${p.slice(8,10)} ${p.slice(10)}`:'+'+p};
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?';
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysTo=s=>{if(!s||s==='ha')return Infinity;const t=new Date(s+'T00:00:00');const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)};
const TL={free:'Bepul',trial:'Sinov',prem:'Premium',biz:'Biznes'};
const AVC=['#13894a','#0f8f8a','#7b56c9','#c98a06','#d9502f','#2b6fd6'];
const avc=id=>AVC[[...String(id)].reduce((z,c)=>z+c.charCodeAt(0),0)%AVC.length];
const ava=(u,cls='')=>`<span class="ava ${cls}" style="background:${avc(u.id)}1f;color:${avc(u.id)}">${esc(ini(u.name))}</span>`;
const haptic=t=>{try{t==='ok'?tg.HapticFeedback.notificationOccurred('success'):t==='err'?tg.HapticFeedback.notificationOccurred('error'):tg.HapticFeedback.impactOccurred('light')}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
function confirmBox(msg){return new Promise(r=>{try{if(tg&&tg.showConfirm&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.2')){tg.showConfirm(msg,ok=>r(!!ok));return}}catch(e){}r(window.confirm(msg))})}

/* ---------- ikonkalar ---------- */
const P={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18.5 14.8c1.7.8 2.8 2.5 3 5.2"/>',
 grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',

 cart:'<path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>',
 coin:'<circle cx="9" cy="9" r="5.5"/><path d="M14.5 9.6a5.5 5.5 0 11-4.9 4.9"/>',

 ring:'<circle cx="12" cy="14" r="6"/><path d="M9 4h6l-1.5 4h-3z"/>',
 bank:'<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>',
 group:'<circle cx="12" cy="7" r="3"/><circle cx="5" cy="10" r="2.3"/><circle cx="19" cy="10" r="2.3"/><path d="M7 20c.5-3.5 2.4-5 5-5s4.5 1.5 5 5M1.5 19c.3-2.4 1.6-3.7 3.5-3.7M22.5 19c-.3-2.4-1.6-3.7-3.5-3.7"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 sheet:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/>',

 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 usd:'<circle cx="12" cy="12" r="9"/><path d="M15 9c-.5-1-1.6-1.5-3-1.5-1.8 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.5 0-2.6-.6-3.1-1.6M12 6v1.5M12 16.5V18"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',

 alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/>',

};
const ic=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;

const S={tab:'home',stats:null,users:null,pays:null,q:'',flt:'all',sort:'new',me:null,u:null,utab:'plan',to:'all',draft:'',payF:'all',busy:false,loadedAt:0};

async function api(action,data){
  if(!API_URL)throw new Error('config.js da server havolasi yo\'q');
  let r;try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,init:tg?tg.initData:''},data||{})),redirect:'follow'})}catch(e){throw new Error("Internetga ulanib bo'lmadi")}
  let j;try{j=await r.json()}catch(e){throw new Error('Server javobi noto\'g\'ri')}
  if(!j.ok){const e=new Error(j.error||'Xato');e.code=j.error;throw e}
  return j;
}

/* ---------- boot ---------- */
function applyTheme(){const dark=tg&&tg.colorScheme==='dark';document.documentElement.classList.toggle('dark',!!dark);try{tg.setHeaderColor(dark?'#07140c':'#eef4f0');tg.setBackgroundColor(dark?'#07140c':'#eef4f0')}catch(e){}}
function screen(icn,h,p,extra){$('#app').innerHTML=`<div class="center"><div><div class="ic">${icn}</div><h2>${h}</h2><p>${p}</p>${extra||''}</div></div>`}
async function boot(){
  if(tg){tg.ready();tg.expand();applyTheme();tg.onEvent('themeChanged',applyTheme)}
  if(!tg||!tg.initData){screen('🔒','Faqat Telegram ichida',"Admin panel faqat Oldi-Berdi botida <b>/admin</b> buyrug'i orqali ochiladi.");return}
  try{const j=await api('admMe');S.me=j.me}
  catch(e){
    const uid=tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id;
    if(e.code==='ADMIN')return screen('⛔','Ruxsat yo\'q',"Bu panel faqat admin uchun. Agar admin siz bo'lsangiz, Apps Script → Script Properties ga <b>ADMIN_TG</b> qilib quyidagi ID'ni yozing.",uid?`<div class="idbox">Telegram ID: <span class="num">${esc(uid)}</span></div>`:'');
    if(e.code==='ADMIN_OLD')return screen('⏱','Sessiya eskirgan','Panelni yoping va botdan qaytadan oching.');
    if(/Noma'lum amal/.test(e.message))return screen('🔄','Serverni yangilang',"Apps Script'ga yangi <b>Code.gs</b> ni qo'yib, Deploy → Manage deployments → <b>New version</b> qiling.");
    return screen('⚠️','Ulanib bo\'lmadi',esc(e.message),`<div style="margin-top:16px"><button class="btn btn-primary" onclick="location.reload()">Qayta urinish</button></div>`);
  }
  render();reloadAll();
}
async function reloadAll(){
  if(S.busy)return;S.busy=true;render();
  try{const [st,us]=await Promise.all([api('admStats'),api('admUsers')]);S.stats=st;S.users=us.users;S.loadedAt=Date.now()}catch(e){toast(e.message)}
  if(S.tab==='pays')await loadPays(true);
  S.busy=false;render();
}
async function loadPays(silent){try{S.pays=(await api('admPayments')).payments}catch(e){toast(e.message);S.pays=S.pays||[]}if(!silent)render()}

/* ---------- hisob-kitob ---------- */
function derive(){
  const L=S.users||[],wk=Date.now()-7*864e5;
  const trialEnd=L.filter(u=>u.t==='trial'&&daysTo(u.until)<=3).sort((a,b)=>daysTo(a.until)-daysTo(b.until));
  const premEnd=L.filter(u=>(u.t==='prem'||u.t==='biz')&&!u.admin&&daysTo(u.until)<=7&&daysTo(u.until)>=0).sort((a,b)=>daysTo(a.until)-daysTo(b.until));
  const td=ymd(new Date()),newToday=L.filter(u=>ymd(new Date(u.createdAt))===td);
  const active=L.filter(u=>u.last>=wk).length;
  const sleeping=L.filter(u=>u.last<Date.now()-14*864e5&&u.tx>0).length;
  return {trialEnd,premEnd,newToday,active,sleeping};
}
function delta(cur,prev){if(!prev&&!cur)return '<span class="delta eq">0%</span>';if(!prev)return '<span class="delta up">yangi</span>';const p=Math.round((cur-prev)/prev*100);return `<span class="delta ${p>0?'up':p<0?'down':'eq'}">${p>0?'+':''}${p}%</span>`}

/* ---------- render ---------- */
const TABS=[['home','home','Asosiy'],['users','users','Mijozlar'],['loyal','star','Sodiqlik'],['survey','chart',"So'rovnoma",1],['sms','phone','Avto-SMS',1],['feat','grid','Sozlamalar'],['pays','card',"To'lovlar"],['msg','send','Xabar']];
const TITLES={home:['Asosiy','Bugungi holat bir qarashda'],users:['Mijozlar',''],feat:['Sozlamalar',"Bo'limlar va narxlar — o'zgarish hammada darhol ishlaydi"],pays:["To'lovlar",'Botdagi Premium va Biznes to\'lovlari'],sms:['Avto-SMS',"Biznes mijozlarning SIM kartasidan ketadigan eslatmalar"],survey:["So'rovnoma",'Mijozlar fikri, muammolar, video roziligi'],loyal:['Sodiqlik','Ballar, hamkorlar, xabarlar va qaytib kelish'],msg:['Xabar yuborish','Bot orqali mijozlarga e\'lon']};
function render(){
  const v=S.tab,d=derive(),att=d.trialEnd.length+d.premEnd.length;
  const body=v==='home'?vHome(d):v==='users'?vUsers():v==='feat'?vFeat():v==='pays'?vPays():v==='loyal'?vLoyal():v==='survey'?vSurvey():v==='sms'?vSms():vMsg();
  const cnt=k=>k==='users'&&S.users?S.users.length:'';
  const name=S.me&&S.me.name||'Admin';
  $('#app').innerHTML=`<div class="shell">
  <aside class="side"><div class="brand"><span class="logo">O</span><div><b>Oldi-Berdi</b><small>Admin panel</small></div></div>
   <nav>${TABS.map(([k,i,l])=>`<button class="${v===k?'on':''}" data-go="${k}">${ic(i)}${l}${cnt(k)!==''?`<span class="cnt">${cnt(k)}</span>`:''}</button>`).join('')}</nav>
   <div class="foot">${esc(name)}<br>${S.loadedAt?'Yangilandi: '+new Date(S.loadedAt).toTimeString().slice(0,5):'Yuklanmoqda…'}</div></aside>
  <main class="main">
   <div class="top"><span class="logo">O</span><div class="t"><b>${TITLES[v][0]}</b><small>${v==='users'&&S.users?S.users.length+' ta mijoz':TITLES[v][1]||'Oldi-Berdi admin'}</small></div>
    <button class="icon-btn ${S.busy?'spin':''}" data-reload="1" aria-label="Yangilash">${ic('refresh')}</button><span class="me" title="${esc(name)}">${esc(ini(name))}</span></div>
   ${body}
  </main>
  <nav class="nav"><div class="in">${TABS.filter(t=>!t[3]).map(([k,i,l])=>`<button class="${v===k?'on':''}" data-go="${k}"><span class="bub">${ic(i)}</span>${l}${k==='home'&&att?`<span class="cnt">${att}</span>`:''}</button>`).join('')}</div></nav></div>`;
  if(render._focus){const el=document.getElementById(render._focus);if(el){el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(e){}}render._focus=null}
}

/* ---------- Asosiy ---------- */
function vHome(d){
  const s=S.stats;
  if(!s)return `<div class="kpis">${'<div class="skel" style="height:118px"></div>'.repeat(4)}</div><div class="skel" style="height:220px;margin-top:14px"></div>`;
  const T=s.tariffs,tot=Math.max(1,s.users),paid=T.prem+T.biz;
  const rev=s.rev||[],cur=rev.length?rev[rev.length-1].s:0,prev=rev.length>1?rev[rev.length-2].s:0;
  const sg=s.signups.map(x=>x.n),wkNow=sg.slice(-7).reduce((a,b)=>a+b,0),wkPrev=sg.slice(-14,-7).reduce((a,b)=>a+b,0);

function spark(vals){const w=86,h=30,mx=Math.max(1,...vals),st=w/(vals.length-1||1);const pts=vals.map((v,i)=>`${(i*st).toFixed(1)},${(h-3-v/mx*(h-6)).toFixed(1)}`).join(' ');return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/></svg>`}
function barChart(vals,labels,color,money){
  const W=320,H=128,n=vals.length,max=Math.max(1,...vals),bw=W/n;
  const bars=vals.map((v,i)=>{const h=v?Math.max(3,v/max*(H-34)):0,x=i*bw+bw*.2,w=bw*.6;return `<rect x="${x.toFixed(1)}" y="${(H-18-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,w/2).toFixed(1)}" fill="${color}" opacity="${v?1:.22}"><title>${money?fmt(v)+" so'm":v}</title></rect>${money&&v?`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${(H-22-h).toFixed(1)}" text-anchor="middle">${v>=1e6?(v/1e6).toFixed(1)+'m':v>=1e3?Math.round(v/1e3)+'k':v}</text>`:''}`}).join('');
  const lab=labels.map((l,i)=>l===''?'':`<text class="ax" x="${(i*bw+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${bars}${lab}<line x1="0" x2="${W}" y1="${H-18}" y2="${H-18}" stroke="var(--line)"/></svg>`;
}
const ML={std:'Standart',biz:'Biznes'};
function modeTag(u){return (u.mode?` <span class="mtag ${u.mode}">${u.mode==='biz'?'🏪':'👤'} ${ML[u.mode]}</span>`:'')+(u.mode==='biz'&&u.lv>=2?' <span class="mtag prio" title="Ustuvor yordam">⚡ Ustuvor</span>':'')}
function untilTxt(u){if(u.t==='free')return '';const s=u.t==='biz'?(u.bizUntil||u.until):u.until;if(!s)return 'muddatsiz';const n=daysTo(s);return n<0?'tugagan':n===0?'bugun tugaydi':n+' kun qoldi'}

function flt(u,f){const wk=Date.now()-7*864e5;switch(f){case 'all':return true;case 'new':return u.createdAt>=wk;case 'active':return u.last>=wk;case 'tg':return u.tg;case 'mstd':return u.mode==='std';case 'mbiz':return u.mode==='biz';

const PST={paid:"To'langan",active:'Kutilmoqda',created:'Kutilmoqda',expired:'Muddati o\'tgan',cancelled:'Bekor qilingan'};
const PTL={month:'1 oy',year:'1 yil',biz:'Biznes · 1 oy',bizyear:'Biznes · 1 yil'};
function payRow(p){return `<div class="row"><span class="fic" style="background:${/^biz/.test(p.tarif)?'var(--plum-bg)':'var(--pos-bg)'};color:${/^biz/.test(p.tarif)?'var(--plum)':'var(--brand)'}">${ic(/^biz/.test(p.tarif)?'shop':'gem')}</span><div class="mid"><div class="t1">${esc(p.name||fphone(p.phone))} · ${PTL[p.tarif]||esc(p.tarif)}</div><div class="t2">${fdt(p.paidAt||p.createdAt)}${p.until?' · '+fdate(p.until)+' gacha':''}</div></div><span class="rcol"><div class="pay-amt num">${fmt(p.amount)}</div><span class="tag ${p.status==='paid'?'paid':'other'}">${PST[p.status]||esc(p.status)}</span></span></div>`}
function vPays(){
  const L=S.pays;if(!L)return '<div class="skel" style="height:300px"></div>';
  const paid=L.filter(p=>p.status==='paid'),sum=paid.reduce((z,p)=>z+(+p.amount||0),0),avg=paid.length?sum/paid.length:0;
  const mk=new Date().toISOString().slice(0,7),mon=paid.filter(p=>new Date(+p.paidAt||0).toISOString().slice(0,7)===mk);
  const F=[['all','Hammasi',L.length],['paid',"To'langan",paid.length],['wait','Kutilmoqda',L.filter(p=>p.status==='active'||p.status==='created').length]];
  const list=L.filter(p=>S.payF==='all'||(S.payF==='paid'?p.status==='paid':(p.status==='active'||p.status==='created')));
  return `<div class="kpis" style="margin-bottom:6px">
   <div class="card kpi k-brand"><div class="kh"><span class="ki">${ic('money')}</span>Jami tushum</div><b class="num">${fmt(sum)}<small>so'm</small></b><div class="kf">${paid.length} ta to'lov</div></div>
   <div class="card kpi k-plum"><div class="kh"><span class="ki">${ic('cal')}</span>Shu oy</div><b class="num">${fmt(mon.reduce((z,p)=>z+(+p.amount||0),0))}<small>so'm</small></b><div class="kf">${mon.length} ta to'lov</div></div>
   <div class="card kpi k-sky"><div class="kh"><span class="ki">${ic('chart')}</span>O'rtacha chek</div><b class="num">${fmt(avg)}<small>so'm</small></b></div>
   <div class="card kpi k-warn"><div class="kh"><span class="ki">${ic('clock')}</span>Kutilmoqda</div><b class="num">${F[2][2]}</b><div class="kf">to'lanmagan havolalar</div></div></div>
  <div class="chips">${F.map(([k,l,n])=>`<button class="chip ${S.payF===k?'on':''}" data-payf="${k}">${l}<span class="n">${n}</span></button>`).join('')}</div>
  <div class="card list" style="margin-top:10px">${list.length?list.map(payRow).join(''):`<div class="empty"><b>Hali to'lov yo'q</b>Mijozlar botda Premium olganda shu yerda ko'rinadi</div>`}</div>`;
}

/* ---------- Xabar ---------- */
function audCount(k){const L=S.users||[];return L.filter(u=>u.tg&&!u.admin&&(k==='all'||(k==='paid'?(u.t==='prem'||u.t==='biz'):u.t===k))).length}
function vMsg(){
  const TO=[['all','Hammaga','botdagi barcha'],['free','Bepul','Premium yo\'q'],['trial','Sinovdagilar','Premium taklif uchun'],['paid','Pullik','Premium + Biznes']];
  return `<div class="msg2"><div>
  <div class="sec" style="margin-top:4px"><h2>Kimga</h2></div>
  <div class="aud">${TO.map(([k,l,d])=>`<button class="${S.to===k?'on':''}" data-to="${k}"><b>${l} · <span class="num">${S.users?audCount(k):'…'}</span></b><small>${d}</small></button>`).join('')}</div>
  <div class="sec"><h2>Matn</h2><span class="hint" id="cc">${(S.draft||'').length}/3500</span></div>
  <div class="card pad"><textarea class="inp" id="bm" maxlength="3500" placeholder="Masalan: Yangi versiya chiqdi! Ilovani yangilang 🎉">${esc(S.draft||'')}</textarea>
  <button class="btn btn-primary w100" style="margin-top:12px" data-send="1">${ic('send')} Yuborish · <span class="num">${S.users?audCount(S.to):''}</span> kishi</button></div>
  <p class="hint" style="margin:10px 2px 0">Faqat botga ulangan mijozlarga boradi. Rasm yoki video yubormoqchi bo'lsangiz — botga yuboring va izohiga <b>/xabar</b> deb yozing.</p></div>
  <div><div class="sec" style="margin-top:4px"><h2>Ko'rinishi</h2><span class="hint">Telegram'da shunday chiqadi</span></div>
  <div class="card pad"><div class="bubble" id="pv"><b>Oldi-Berdi</b>📢 ${esc(S.draft||'Xabar matni shu yerda ko\'rinadi…')}</div></div></div></div>`;
}

/* ---------- Avto-SMS ---------- */
async function loadSms(silent){try{S.sms=await api('admSms')}catch(e){toast(e.message);S.sms=S.sms||null}if(!silent)render()}
function vSms(){const V=S.sms;if(!V)return `<div class="kpis">${'<div class="skel" style="height:118px"></div>'.repeat(4)}</div><div class="skel" style="height:300px;margin-top:14px"></div>`;
 const c=V.cfg,D=V.devices.slice().sort((a,b)=>(b.online-a.online)||(b.today.sent-a.today.sent)),on=D.filter(d=>d.online).length;
 return `<div class="kpis">
  <div class="card kpi ${c.off?'k-warn':'k-brand'}"><div class="kh"><span class="ki">${ic('phone')}</span>Holati</div><b>${c.off?"O'chiq":'Ishlayapti'}</b><div class="kf">${c.off?'Hech bir telefon SMS yubormaydi':'Navbat telefonlarga beriladi'}</div></div>
  <div class="card kpi k-sky"><div class="kh"><span class="ki">${ic('users')}</span>Telefonlar</div><b class="num">${D.length}</b><div class="kf">${on} tasi hozir onlayn</div></div>
  <div class="card kpi k-brand"><div class="kh"><span class="ki">${ic('send')}</span>Bugun yuborildi</div><b class="num">${V.today.sent}</b><div class="kf">${V.today.queued} tasi navbatda</div></div>
  <div class="card kpi ${V.today.failed?'k-warn':'k-plum'}"><div class="kh"><span class="ki">${ic('chart')}</span>Bugun xato</div><b class="num">${V.today.failed}</b><div class="kf">${V.today.sent+V.today.failed?Math.round(V.today.sent/(V.today.sent+V.today.failed)*100)+'% muvaffaqiyat':'—'}</div></div></div>
 <div class="set2"><div>
  <div class="sec"><h2>Ulangan telefonlar</h2><span class="hint">${D.length} ta</span></div>
  ${D.length?`<div class="card list">${D.map(d=>`<button class="row" data-user="${esc(d.acc)}"><span class="ava" style="background:${d.online?'#19a35b':'#c9a227'}1f;color:${d.online?'#19a35b':'#a07a00'}">${ic('phone')}</span><div class="mid"><div class="t1">${esc(d.shop||d.name)} <span class="hint">· ${esc(d.model||'Android')}</span></div><div class="t2">${d.online?'🟢 onlayn':'🟠 '+ago(d.lastPing)}${d.sim?' · '+esc(d.sim):''} · ${d.auto?'avto yoqiq':'avto o\'chiq'} · limit ${d.limit}${d.appVer?' · v'+esc(d.appVer):''}</div></div><span class="rcol"><b class="num" style="font-size:18px">${d.today.sent}</b><div class="t2">${d.today.failed?`<span style="color:#c2401f">${d.today.failed} xato</span>`:'bugun'}</div></span></button>`).join('')}</div>`:`<div class="card empty"><b>Hali telefon ulanmagan</b>Biznes mijozlar Profil → Avto-SMS orqali ulaydi.</div>`}
 </div><div>
  <div class="sec"><h2>Boshqaruv</h2></div>
  <div class="card pad"><div class="feat" style="padding:0 0 12px"><div class="mid"><div class="t1">Avto-SMS (hammasi uchun)</div><div class="t2">O'chirilsa, telefonlar navbatni olmaydi — SMS'lar kutib turadi</div></div><div class="seg"><button class="${c.off?'on m-off':''}" data-smsoff="1">O'chiq</button><button class="${c.off?'':'on'}" data-smsoff="0">Yoqiq</button></div></div>
  <div class="field"><label for="sms-def">Standart kunlik limit (yangi mijozlar uchun)</label><input class="inp num" id="sms-def" type="number" min="10" max="150" value="${c.defLimit}"></div>
  <div class="field"><label for="sms-gap">SMS orasidagi vaqt (soniya)</label><input class="inp num" id="sms-gap" type="number" min="5" max="300" value="${c.gap}"></div>
  <button class="btn btn-primary w100" data-smssave="1">Saqlash</button>
  <p class="hint" style="margin:8px 0 0">Limit: 10–150. Oraliq juda qisqa bo'lsa, operator SIM kartani spam deb bloklashi mumkin — 20–30 soniya tavsiya etiladi.</p></div>
 </div></div>`}
/* ---------- hodisalar ---------- */
function go(t){S.tab=t;haptic();if(t==='pays'&&!S.pays)loadPays();if(t==='loyal'&&!S.ly)loadLoyal();if(t==='survey')loadSurvey();if(t==='sms')loadSms();render();window.scrollTo(0,0)}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-user],[data-pick]');if(!b)return;const d=b.dataset;
  if(d.go){closeSheet(true);go(d.go);return}
  if(d.reload){reloadAll();if(S.tab==='loyal')loadLoyal();if(S.tab==='survey')loadSurvey();if(S.tab==='sms')loadSms();return}
  if(d.svrow){svRowSheet(d.svrow);return}
  if(d.smsoff){const off=d.smsoff==='1';if(off&&!await confirmBox("Avto-SMS hamma uchun to'xtatilsinmi? Telefonlar navbatni olmaydi, SMS'lar kutib turadi."))return;try{const j=await api('admSmsSet',{off});S.sms.cfg=j.cfg;haptic('ok');toast(off?"To'xtatildi":'Yoqildi');render()}catch(er){toast(er.message)}return}
  if(d.smssave){const defLimit=+(($('#sms-def')||{}).value||0),gap=+(($('#sms-gap')||{}).value||0);if(defLimit<10||defLimit>150){toast('Limit 10–150 oralig\'ida');return}if(gap<5||gap>300){toast('Oraliq 5–300 soniya');return}b.disabled=true;try{const j=await api('admSmsSet',{defLimit,gap});S.sms.cfg=j.cfg;haptic('ok');toast('Saqlandi');render()}catch(er){toast(er.message);b.disabled=false}return}
  if(d.svon){const on=d.svon==='1';try{const j=await api('admSurveySet',{on});S.sv.survey=j.survey;haptic('ok');toast(on?'Faol':'Yopildi');render()}catch(er){toast(er.message)}return}
  if(d.svrestart){if(!await confirmBox("Yangi so'rovnoma boshlansinmi? Hisoblagichlar noldan boshlanadi, eski javoblar jadvalda qoladi."))return;try{await api('admSurveySet',{restart:1});await loadSurvey();toast('Boshlandi')}catch(er){toast(er.message)}return}
  if(d.svsend){const text=(($('#sv-text')||{}).value||'').trim(),to=($('#sv-to')||{}).value||'all';if(!text){toast('Matnni yozing');return}
    if(!await confirmBox("So'rovnoma havolasi tanlangan mijozlarga bot va push orqali yuboriladi. Davom etamizmi?"))return;
    b.disabled=true;b.textContent='Yuborilmoqda…';try{const j=await api('admSurveySend',{text,to});S.sv.survey=j.survey;haptic('ok');toast(`✅ ${j.n} kishiga yuborildi${j.skip?` · ${j.skip} tasi o'tkazildi`:''}`);render()}catch(er){toast(er.message);b.disabled=false;b.textContent='Yuborish'}return}
  if(d.lyin){S.lyIn=+d.lyin;render();return}
  if(d.lym){S.lyM=d.lym;render();return}
  if(d.lyto){S.lyDraft=($('#ly-text')||{}).value||S.lyDraft;S.lyTo=d.lyto;render();setTimeout(()=>{const t=$('#ly-text');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.focus()}},60);return}
  if(d.lymsg){msgEditor(d.lymsg);return}
  if(d.lyon){const k=d.lyon,on=d.v==='1';try{const j=await api('admMsgCfg',{key:k,on});S.ly.msgs=j.msgs;haptic('ok');toast(on?'Yoqildi':"O'chirildi");render()}catch(er){toast(er.message)}return}
  if(d.mesave||d.mereset){const k=d.mesave||d.mereset;const body={key:k};if(d.mereset){if(!await confirmBox('Asl matnlar tiklansinmi?'))return;body.reset=1}else{['std','biz'].forEach(m=>{body[m]={};['uz','ru'].forEach(l=>{const el=document.querySelector(`[data-me="${m}.${l}"]`);body[m][l]=(el?el.value:'').split('\n').map(x=>x.trim()).filter(Boolean)})})}
    b.disabled=true;try{const j=await api('admMsgCfg',body);S.ly.msgs=j.msgs;haptic('ok');toast('Saqlandi');closeSheet();render()}catch(er){toast(er.message);b.disabled=false}return}
  if(d.lycfg){const cfg={};LCFG_L.forEach(([k])=>{const v=String(($('#lc-'+k)||{}).value||'').replace(/\D/g,'');if(v!=='')cfg[k]=+v});b.disabled=true;try{const j=await api('admLoyalCfg',{cfg});S.ly.cfg=j.cfg;haptic('ok');toast('Saqlandi');render()}catch(er){toast(er.message);b.disabled=false}return}
  if(d.lysend){const text=(($('#ly-text')||{}).value||'').trim(),to=($('#ly-to')||{}).value||'all';if(!text){toast('Matnni yozing');return}
    if(!await confirmBox('Xabar tanlangan guruhga push va bot orqali yuboriladi. Davom etamizmi?'))return;
    b.disabled=true;b.textContent='Yuborilmoqda…';try{const j=await api('admNotify',{text,to});S.lyDraft='';haptic('ok');toast(`✅ ${j.n} kishiga yuborildi${j.skip?` · ${j.skip} tasi o'tkazildi`:''}`);loadLoyal()}catch(er){toast(er.message);b.disabled=false;b.textContent='Yuborish'}return}
  if(d.flt){S.flt=d.flt;if(S.tab!=='users'){S.tab='users';window.scrollTo(0,0)}render();return}
  if(d.pick){closeSheet(true);openUser(d.pick,'plan');return}
  if(d.user){haptic();openUser(d.user);return}
  if(d.close){closeSheet();return}
  if(d.qa==='prem'){if(!S.users){toast('Mijozlar yuklanmoqda…');return}pickUser();return}
  if(d.qa==='prices'){go('feat');setTimeout(()=>{const el=$('#prices');el&&el.scrollIntoView({behavior:'smooth',block:'start'})},60);return}
  if(d.payf){S.payF=d.payf;render();return}
  if(d.to){S.draft=($('#bm')||{}).value||S.draft;S.to=d.to;render();return}
  if(d.utab){S.utab=d.utab;rerenderUser();return}
  if(d.copy){try{await navigator.clipboard.writeText(d.copy);toast(/^\+?\d[\d ]+$/.test(d.copy)?'Raqam nusxalandi':'Nusxalandi')}catch(er){toast(d.copy)}return}
  if(d.feat){
    const s=S.stats;if(!s||s.feat[d.feat]===d.m)return;const old=s.feat[d.feat];
    if(d.m==='off'&&!await confirmBox("Bo'lim hamma mijozlarda yashiriladi. Ularning yozuvlari o'chmaydi. Davom etamizmi?"))return;
    s.feat[d.feat]=d.m;render();
    try{const j=await api('admFeat',{f:d.feat,mode:d.m});s.feat=j.feat;haptic('ok');toast('Saqlandi');if(d.feat==='biz'){const st=await api('admStats');S.stats=st;render()}}catch(er){s.feat[d.feat]=old;render();haptic('err');toast(er.message)}
    return}
  if(d.prices){const g=k=>String(($('#pr-'+k)||{}).value||'').replace(/\D/g,'');const body={month:g('month'),year:g('year')};if(!($('#pr-biz')||{}).disabled){body.biz=g('biz');body.bizyear=g('bizyear')}
    b.disabled=true;try{const j=await api('admPrices',body);S.stats.prices=j.prices;haptic('ok');toast('Narxlar saqlandi');render()}catch(er){haptic('err');toast(er.message);b.disabled=false}return}
  if(d.send){const text=(($('#bm')||{}).value||'').trim();if(!text){toast('Matnni yozing');return}
    const n=audCount(S.to);if(!n){toast("Bu guruhda botga ulangan mijoz yo'q");return}
    if(!await confirmBox(`Xabar ${n} kishiga yuboriladi. Davom etamizmi?`))return;
    b.disabled=true;b.innerHTML='Yuborilmoqda…';
    try{const j=await api('admBroadcast',{text,to:S.to});S.draft='';haptic('ok');toast(`✅ ${j.n} kishiga yuborildi${j.bad?` · ${j.bad} ta yetmadi`:''}`);render()}catch(er){haptic('err');toast(er.message);render()}return}
  const uid=S.u;if(!uid)return;
  if(d.plan){let v=d.v;if(v==='custom'){v=String(($('#pd-'+d.plan)||{}).value||'').replace(/\D/g,'');if(!v){toast('Kun sonini yozing');return}}
    const nm=d.plan==='biz'?'Biznes':'Premium';
    if(v==='0'&&!await confirmBox(`${nm} o'chiriladi. Davom etamizmi?`))return;
    b.disabled=true;try{const j=await api('admSetPlan',{id:uid,kind:d.plan,v,notify:true});haptic('ok');toast(`${nm}: ${j.until}`);await refreshUser()}catch(er){haptic('err');toast(er.message);b.disabled=false}return}
  if(d.trial){b.disabled=true;try{await api('admTrial',{id:uid,v:d.trial});haptic('ok');toast('Saqlandi');await refreshUser()}catch(er){toast(er.message);b.disabled=false}return}
  if(d.ulogout){if(!await confirmBox('Mijoz barcha telefonlardan chiqariladi va qayta parol bilan kiradi. Davom etamizmi?'))return;
    try{const j=await api('admLogout',{id:uid});haptic('ok');toast(`${j.n} ta qurilmadan chiqarildi`);refreshUser()}catch(er){toast(er.message)}return}
  if(d.upass){if(!await confirmBox("Yangi vaqtinchalik parol yaratiladi, PIN o'chadi va mijoz hamma qurilmadan chiqadi. Davom etamizmi?"))return;
    try{const j=await api('admPass',{id:uid,notify:true});haptic('ok');
      setSheet(`<div class="center" style="min-height:0;padding:24px 0"><div><div class="ic">🔑</div><h2>Yangi parol</h2><div class="idbox" style="font-size:28px;letter-spacing:.14em">${esc(j.pass)}</div><p style="margin-top:12px">${j.sent?"Parol mijozning Telegram'iga ham yuborildi.":"Mijoz botga ulanmagan — parolni unga o'zingiz ayting."}</p><button class="btn btn-primary w100" style="margin-top:18px" data-back="1">Mijozga qaytish</button></div></div>`)}
    catch(er){toast(er.message)}return}
  if(d.back){rerenderUser();refreshUser();return}
  if(d.umsg){const u=S.ud&&S.ud.user;setSheet(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-size:19px;font-weight:800">Botda yozish</h3><button class="icon-btn" data-back="1">${ic('x')}</button></div><p class="hint" style="margin:0 2px 10px">${esc(u?u.name:'')} Oldi-Berdi botida shu xabarni oladi.</p><div class="field"><textarea class="inp" id="um" maxlength="3500" placeholder="Xabar matni"></textarea></div><div class="grid2"><button class="btn btn-ghost" data-back="1">Orqaga</button><button class="btn btn-primary" data-umsend="1">${ic('send')} Yuborish</button></div>`);setTimeout(()=>{const t=$('#um');t&&t.focus()},200);return}
  if(d.umsend){const text=(($('#um')||{}).value||'').trim();if(!text){toast('Matnni yozing');return}b.disabled=true;
    try{await api('admMsg',{id:uid,text});haptic('ok');toast('✅ Yuborildi');rerenderUser()}catch(er){haptic('err');toast(er.message);b.disabled=false}return}
});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='q'){S.q=e.target.value;render._focus='q';render();return}
  if(id==='bm'){S.draft=e.target.value;const pv=$('#pv');if(pv)pv.innerHTML='<b>Oldi-Berdi</b>📢 '+esc(S.draft||'Xabar matni shu yerda ko\'rinadi…');const cc=$('#cc');if(cc)cc.textContent=S.draft.length+'/3500';return}
  if(/^pr-/.test(id)){const v=e.target.value.replace(/\D/g,'');e.target.value=v?fmt(v):'';const g=k=>+String(($('#pr-'+k)||{}).value||'').replace(/\D/g,'');const sn=$('#save-note');if(sn)sn.innerHTML=saveNote(g('month'),g('year'));const sb=$('#save-note-b');if(sb)sb.innerHTML=saveNote(g('biz'),g('bizyear'))}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){S.sort=e.target.value;render()}});
boot();
</script>
</body>
</html>
