<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oldi-Berdi</title>
<meta name="description" content="Qarz daftari: kimga qancha berdingiz, kimdan qancha oldingiz">
<meta name="theme-color" content="#0b5c33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oldi-Berdi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one phone-width column; green hero header like the reference poster, white cards, bottom tab bar with a raised + button */
:root{
  --bg:#edf5ef; --surface:#ffffff; --surface-2:#f3f8f4; --fg:#0e2a1b; --muted:#5b7465; --line:#dbe7de;
  --brand:#13894a; --brand-deep:#0b5c33; --lime:#bff26f; --on-brand:#ffffff;
  --hero-a:#0b5c33; --hero-b:#1a9c55;
  --pos:#119a55; --pos-bg:#e3f6ea; --neg:#d9502f; --neg-bg:#fdebe5; --teal:#0f8f8a; --teal-bg:#e0f4f3; --plum:#7b56c9; --plum-bg:#efe9fb;
  --warn:#c98a06; --warn-bg:#fff4d9;
  --shadow:0 10px 30px -12px rgba(11,70,38,.28);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06140c; --surface:#0e2217; --surface-2:#132c1e; --fg:#e6f4ea; --muted:#8eae9a; --line:#1d3b29;
  --brand:#28b866; --brand-deep:#1a8a4b; --lime:#c4f57a; --on-brand:#04130a;
  --hero-a:#07301b; --hero-b:#0f6a39;
  --pos:#3fd282; --pos-bg:#123a24; --neg:#ff8366; --neg-bg:#3a1c14; --teal:#45cfc8; --teal-bg:#0f3533; --plum:#b49bf0; --plum-bg:#2a2140;
  --warn:#f2c14e; --warn-bg:#3a2e0e;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#06140c; --surface:#0e2217; --surface-2:#132c1e; --fg:#e6f4ea; --muted:#8eae9a; --line:#1d3b29;
  --brand:#28b866; --brand-deep:#1a8a4b; --lime:#c4f57a; --on-brand:#04130a;
  --hero-a:#07301b; --hero-b:#0f6a39;
  --pos:#3fd282; --pos-bg:#123a24; --neg:#ff8366; --neg-bg:#3a1c14; --teal:#45cfc8; --teal-bg:#0f3533; --plum:#b49bf0; --plum-bg:#2a2140;
  --warn:#f2c14e; --warn-bg:#3a2e0e;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.ava{position:relative}
.ava img{position:absolute;inset:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* splash & auth */
.splash{min-height:100vh;display:grid;place-items:center;text-align:center;color:#fff;background:linear-gradient(160deg,var(--hero-a),var(--hero-b))}
.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(150deg,#2fd17a,#0f7a41);display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);margin:0 auto}
.logo svg{width:44px;height:44px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 0.9s linear infinite;margin:18px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
.auth{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(170deg,var(--hero-a) 0,var(--hero-b) 330px,var(--bg) 331px)}
.auth-top{color:#fff;text-align:center;padding-block:40px 28px}
.auth-top h1{font-size:30px;margin:14px 0 2px;letter-spacing:-.02em;font-weight:800}
.auth-top h1 span{color:var(--lime)}
.auth-top p{margin:0;opacity:.85}
.auth-card{background:var(--surface);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:28px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px -3px rgba(0,0,0,.2)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.feat div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:13px;color:var(--muted)}
.feat b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--brand)}
textarea.inp{resize:vertical;min-height:70px}
.inp-wrap{position:relative}
.inp-wrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:8px;color:var(--muted);display:grid;place-items:center;border-radius:10px}
.inp-wrap .eye svg{width:20px;height:20px;display:block}
.inp-wrap .eye.on{color:var(--brand)}
.inp-wrap input[type=password],.inp-wrap input.pw{padding-right:46px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.inp{min-width:0}
input[type=date].inp{-webkit-appearance:none;appearance:none;min-height:50px;padding-inline:12px;font-size:15px}
.field>label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:359px){.quick{gap:4px}.quick button{font-size:11px}.qi{width:46px;height:46px;border-radius:15px}.seg button small{display:none}.nav button{font-size:10px}.ni{padding:4px 8px}.sheet-head h3{font-size:17px}}
@media (orientation:landscape) and (max-height:500px){.sheet{max-height:96vh}.hero{padding-block:12px 66px}}
.amount-inp{font-size:28px;font-weight:800;letter-spacing:-.02em;padding:14px 64px 14px 14px}
.cur-tag{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;width:min(448px,calc(100% - 32px));display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:10px 10px 10px 14px;border-radius:16px;box-shadow:var(--shadow);animation:su .25s}
.upd span{flex:1;font-size:13.5px;font-weight:600;line-height:1.3}
.upd .btn{background:var(--lime);color:#0b2a17;padding:9px 14px;font-size:13.5px;border-radius:11px}
.new-list{margin:0 0 14px;padding-left:20px;color:var(--fg)}
.new-list li{margin-bottom:6px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-primary{background:var(--brand);color:var(--on-brand);width:100%}
.btn-ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn-danger{background:var(--neg-bg);color:var(--neg)}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:11px}
.err{color:var(--neg);font-size:13px;font-weight:600;min-height:18px;margin:-4px 0 10px}
.hint{font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 10px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.seg button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;line-height:1.25}
.seg button.on{border-color:var(--brand);background:var(--pos-bg)}

/* hero (home) */
.hero{background:linear-gradient(165deg,var(--hero-a),var(--hero-b));color:#fff;padding-block:18px 74px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(191,242,111,.28),transparent 70%)}
.hero-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.greet{opacity:.8;font-size:14px}
.hname{font-size:clamp(18px,5.6vw,21px);line-height:1.25;font-weight:800;letter-spacing:-.01em}
.mode-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);padding:4px 9px;border-radius:99px;margin-top:6px}
.mode-pill i{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.mode-pill.off i{background:#ffc35a}
.bal-card{background:var(--surface);color:var(--fg);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-top:-58px;position:relative;z-index:2}
.bal-label{font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.bal-big{font-size:clamp(23px,8vw,32px);overflow-wrap:anywhere;font-weight:800;letter-spacing:-.03em;margin:2px 0 2px}
.bal-sub{font-size:13px;color:var(--muted)}
.bal-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;font-weight:700;color:var(--muted)}
.tile b{font-size:clamp(14px,4.2vw,18px);letter-spacing:-.02em;overflow-wrap:anywhere}
.tile small{color:var(--muted);font-size:12px}
.tile.p{background:var(--pos-bg)} .tile.p b{color:var(--pos)}
.tile.n{background:var(--neg-bg)} .tile.n b{color:var(--neg)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--fg);padding:4px 0}
.qi{width:52px;height:52px;border-radius:17px;display:grid;place-items:center}
.qi svg{width:24px;height:24px}
.t-lend{background:var(--pos-bg);color:var(--pos)} .t-borrow{background:var(--neg-bg);color:var(--neg)}
.t-got{background:var(--teal-bg);color:var(--teal)} .t-paid{background:var(--plum-bg);color:var(--plum)}

/* sections & lists */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.sec-head h2{font-size:17px;margin:0;letter-spacing:-.01em}
.link{color:var(--brand);font-weight:700;font-size:13.5px;padding:4px}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex-shrink:0}
.item .r b{display:block;font-size:15px}
.item .r small{font-size:11.5px;color:var(--muted)}
.ticon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;position:relative}
.ticon svg{width:20px;height:20px}
.thumb-dot{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.thumb-dot svg{width:11px;height:11px}
.ava{border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden;background:var(--brand)}
.ava img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;letter-spacing:.02em;vertical-align:2px}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.empty .ei{width:60px;height:60px;border-radius:20px;background:var(--pos-bg);color:var(--brand);display:grid;place-items:center;margin:0 auto 10px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.date-sep{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.topbar h1{font-size:22px;margin:0;flex:1;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--fg);flex-shrink:0}
.icon-btn svg{width:20px;height:20px}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .inp{padding-left:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* person page */
.p-head{text-align:center;padding-block:4px 6px}
.p-head h2{margin:10px 0 2px;font-size:22px;letter-spacing:-.02em}
.p-phone{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-weight:600;white-space:nowrap}
.p-phone svg{width:16px;height:16px;flex-shrink:0}
.p-bal{margin:14px 0 4px;padding:14px;border-radius:18px;text-align:center}
.p-bal span{font-size:13px;font-weight:700}
.p-bal b{display:block;font-size:28px;letter-spacing:-.03em}
.p-bal.p{background:var(--pos-bg);color:var(--pos)} .p-bal.n{background:var(--neg-bg);color:var(--neg)} .p-bal.z{background:var(--surface-2);color:var(--muted)}
.p-note{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:13.5px;color:var(--muted);margin-top:10px;text-align:left;white-space:pre-wrap}
.log{font-size:12.5px;color:var(--muted);padding:10px 14px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.log:last-child{border-bottom:0}

/* bottom nav */
.spacer{height:calc(96px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none}
.nav-in{max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;pointer-events:auto;padding:6px max(8px,env(safe-area-inset-left,0px)) 8px max(8px,env(safe-area-inset-right,0px));box-shadow:0 -8px 24px -18px rgba(0,0,0,.4)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:12px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand)}
.nav button.on .ni{background:var(--pos-bg)}
.ni{padding:4px 14px;border-radius:12px;display:grid;place-items:center}
.fab{width:58px;height:58px;border-radius:50%;background:linear-gradient(150deg,#2fd17a,var(--brand-deep));color:#fff;display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 10px 22px -8px rgba(11,92,51,.7);border:4px solid var(--surface)}
.fab svg{width:26px;height:26px}
.nav .fab{color:#fff;padding:0;border-radius:50%;display:grid}
.nav .fab svg{width:26px;height:26px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(4,20,11,.5);animation:fi .2s}
.sheet{position:relative;width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:su .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:19px;letter-spacing:-.01em}
@keyframes su{from{transform:translateY(40px);opacity:0}}
@keyframes fi{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.picked{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1.5px solid var(--brand);border-radius:14px;padding:8px 10px}
.picked .mid{flex:1;min-width:0}
.picked b{display:block}
.sugg{margin-top:6px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.sugg .item{padding:9px 12px}
.create-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;color:var(--brand);font-weight:700;text-align:left;background:var(--pos-bg)}
.create-btn svg{width:20px;height:20px}
.photo-pick{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:14px;padding:10px;cursor:pointer;background:var(--surface-2)}
.photo-pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-pick .ph{width:64px;height:64px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--muted);overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
.photo-pick .ph img{width:100%;height:100%;object-fit:cover}
.photo-pick b{display:block;font-size:14px}
.ava-pick{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer}
.ava-pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ava-pick .cam{margin-top:-30px;margin-left:58px;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;border:3px solid var(--surface)}
.ava-pick .cam svg{width:14px;height:14px}
.tx-photo{width:100%;border-radius:14px;height:150px;object-fit:contain;background:var(--surface-2);border:1px solid var(--line);margin-bottom:12px;cursor:zoom-in;display:block}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted)}
.kv b{text-align:right;min-width:0;word-break:break-word}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:20px}
.viewer img{max-width:100%;max-height:100%;border-radius:12px}

.banner{background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:12px;margin-top:12px}

.menu .item{font-weight:600}

.copt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface-2);border:1.5px solid var(--line);color:var(--fg);text-decoration:none}
.copt:active{transform:scale(.99)}
.copt b{display:block;font-size:16px}
.copt small{color:var(--muted);font-size:13px}
.copt .qi{width:48px;height:48px;border-radius:15px;flex-shrink:0}
.copt .go{margin-left:auto;color:var(--muted)}
.copt .go svg{width:18px;height:18px;transform:rotate(180deg)}
.savebar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:60;display:flex;align-items:center;gap:8px;background:#0e2a1b;color:#fff;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:99px;box-shadow:var(--shadow)}
.savebar i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}

.trust{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;vertical-align:2px;letter-spacing:.01em}
.trust.good{background:var(--pos-bg);color:var(--pos)}.trust.mid{background:var(--warn-bg);color:var(--warn)}.trust.bad{background:var(--neg-bg);color:var(--neg)}
.p-head .trust{font-size:13px;padding:5px 12px;margin-top:8px}
.rate-chip{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:5px 10px;border-radius:99px}
.cur-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:800;color:var(--brand);font-size:14px;transform:translateY(-50%)}
.usd-note{display:block;font-size:12px;font-weight:600;margin-top:4px;opacity:.85}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;padding:4px 0}
.chk input{width:20px;height:20px;accent-color:var(--brand)}

.plan-row:last-child{border-bottom:0}

function phSrc(v){if(!v)return'';if(v.startsWith('data:'))return v;if(v.startsWith('d:')){if(PH[v])return PH[v];const c=LS.get('ph_'+v);if(c){PH[v]=c;return c}loadPh(v);return''}return''}

const S={api:+(LS.get('oldiberdi_api')||1),confirms:{},rate:(()=>{try{return JSON.parse(LS.get('oldiberdi_rate')||'null')}catch(e){return null}})(),usd:{},alloc:{},trust:{},token:LS.get('oldiberdi_token'),acc:null,people:{},tx:{},view:'home',pid:null,pq:'',pf:'all',hq:'',hf:'all',loaded:{p:false,t:false},stale:false,unsub:[],bal:{},authTab:'login'};
/* currency: a record may be in dollars; totals are shown in the main currency at the Central Bank rate */
const USD_FALLBACK=12800;
function rate(){return (S.rate&&S.rate.usd)||USD_FALLBACK}
function usdOn(){return cur()==="so'm"&&S.api>=2}
function isUSD(t){return !!t&&t.cur==='USD'}
function baseAmt(t){return (+t.amount||0)*(isUSD(t)&&usdOn()?rate():1)}
function curOf(t){return isUSD(t)?'$':cur()}
function amtTxt(t){return isUSD(t)?'$'+fmt(t.amount):fmt(t.amount)+' '+cur()}
function compute(){
 const bal={},usd={};for(const id in S.people){bal[id]=0;usd[id]=0}
 for(const t of Object.values(S.tx)){if(!(t.pid in bal))continue;const sg=T[t.type]?.sign||0;bal[t.pid]+=sg*baseAmt(t);if(isUSD(t))usd[t.pid]+=sg*(+t.amount||0)}
 for(const k in bal){bal[k]=Math.round(bal[k]*100)/100;usd[k]=Math.round(usd[k]*100)/100}
 S.bal=bal;S.usd=usd;allocate();
}
/* repayments are applied to the oldest loan first; this gives each loan (and each installment) a paid date */
function allocate(){
 const alloc={},trust={},byP={},td=today();
 for(const t of Object.values(S.tx))(byP[t.pid]=byP[t.pid]||[]).push(t);
 const ord=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0);
 for(const pid in byP){
  const list=byP[pid].slice().sort(ord);
  for(const [lt,rt] of [['lend','got'],['borrow','paid']]){
   const loans=list.filter(t=>t.type===lt).map(t=>{const f=isUSD(t)&&usdOn()?rate():1;let c=0;const inst=(Array.isArray(t.plan)?t.plan:[]).filter(x=>x&&x.d&&+x.a>0).map(x=>{c+=x.a*f;return {d:x.d,a:+x.a,cum:c,paidDate:null}});const total=baseAmt(t);return {id:t.id,t,total,left:total,paid:0,paidDate:null,inst}});
   let li=0;
   for(const r of list.filter(t=>t.type===rt)){let amt=baseAmt(r);
    while(amt>0.001&&li<loans.length){const L=loans[li];const take=Math.min(amt,L.left);L.left-=take;L.paid+=take;amt-=take;
     L.inst.forEach(i=>{if(!i.paidDate&&L.paid>=i.cum-0.5)i.paidDate=r.date});
     if(L.left<=0.5){L.left=0;L.paidDate=r.date;li++}}}
   loans.forEach(L=>{alloc[L.id]=L});
   if(lt==='lend'){let ok=0,n=0;
    loans.forEach(L=>{
     if(L.inst.length)L.inst.forEach(i=>{if(i.paidDate){n++;if(i.paidDate<=i.d)ok++}else if(i.d<td)n++});
     else if(L.t.due){if(L.paidDate){n++;if(L.paidDate<=L.t.due)ok++}else if(L.t.due<td)n++}
     else if(L.paidDate){n++;ok++}});
    if(n)trust[pid]={score:Math.round(ok/n*100),n}}
  }
 }
 S.alloc=alloc;S.trust=trust;
}
function nextInst(L){return L&&L.inst.find(i=>!i.paidDate)}
function overdueOf(pid){const b=S.bal[pid]||0;if(!b)return null;const want=b>0?'lend':'borrow';const td=today();let hit=null;
 for(const x of Object.values(S.tx)){if(x.pid!==pid||x.type!==want)continue;const L=S.alloc[x.id];if(L&&L.left<=0.5)continue;
  const d=L&&L.inst.length?(nextInst(L)||{}).d:x.due;
  if(d&&d<td&&(!hit||d<hit))hit=d}
 return hit}
function trustBadge(pid,big){const r=S.trust[pid];if(!r)return '';const c=r.score>=85?'good':r.score>=60?'mid':'bad';const l=r.score>=85?'Ishonchli':r.score>=60?"O'rtacha":'Kechiktiradi';return `<span class="trust ${c}" title="O'z vaqtida qaytarish: ${r.score}%">${big?l+' · ':''}${r.score}%</span>`}
function addMonths(ds,k){const [y,m,d]=ds.split('-').map(Number);const last=new Date(y,m-1+k+1,0).getDate();const x=new Date(y,m-1+k,Math.min(d,last));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function planHtml(L,compact){if(!L||!L.inst.length)return '';const td=today();const usd=isUSD(L.t);
 const rows=L.inst.map((i,k)=>{const st=i.paidDate?`<span class="st ok">To'landi</span>`:i.d<td?`<span class="st late">Kechikkan</span>`:`<span class="st wait">Kutilmoqda</span>`;return `<div class="plan-row"><span>${k+1}. ${fdate(i.d)}</span><span class="num"><b>${usd?'$'+fmt(i.a):fmt(i.a)}</b> ${st}</span></div>`}).join('');
 const pct=L.total?Math.round(L.paid/L.total*100):0;
 return `<div class="plan-box"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:14px"><span>${I.cal.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px;margin-right:4px"')}To'lov grafigi</span><span class="num">${pct}%</span></div><div class="prog"><i style="width:${pct}%"></i></div><div class="hint">To'langan: <b class="num">${money(L.paid)}</b> · Qoldi: <b class="num">${money(L.left)}</b></div><div class="plan-list">${rows}</div></div>`}
function txSorted(list){return list.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0))}

function writeErr(e){return (e&&e.message)||"Saqlab bo'lmadi. Internetni tekshirib, qayta urinib ko'ring."}
function startSession(a,restore,data){
 S.acc=null;setAcc(a);
 S.locked=!!(restore&&a.pinHash);S.setup=a.pinHash?null:{step:'pin1',mode:'new'};S.pinBuf='';S.pinErr='';S.pinTries=0;
 clearInterval(S.poll);S.people={};S.tx={};S.loaded={p:false,t:false};S.view='home';S.stale=false;
 if(data)applySync(data);else{try{const c=JSON.parse(LS.get('oldiberdi_cache')||'null');if(c&&c.acc&&c.acc.id===a.id)applySync(c,true)}catch(e){}}
 if(!data)sync();
 checkVersion();
 S.poll=setInterval(()=>{if(!document.hidden){sync();checkVersion()}},30000);
 render();
 const seen=+(LS.get('oldiberdi_seen_ver')||0);
 if(!seen)LS.set('oldiberdi_seen_ver',String(APP_VERSION));else if(seen<APP_VERSION)S.showNew=true;
 maybeNew();
}
function applySync(j,fromCache){
 S.people={};(j.people||[]).forEach(p=>S.people[p.id]=p);
 S.tx={};(j.tx||[]).forEach(t=>S.tx[t.id]=t);
 if(j.confirms)S.confirms=j.confirms;
 if(!fromCache){S.api=j.api||1;LS.set('oldiberdi_api',String(S.api))}
 if(j.rate&&j.rate.usd){S.rate=j.rate;LS.set('oldiberdi_rate',JSON.stringify(j.rate))}
 if(j.acc&&!fromCache)setAcc(j.acc);
 S.loaded={p:true,t:true};compute();
 if(!fromCache){S.stale=false;saveCache()}
}
function saveCache(){if(!S.acc)return;try{localStorage.setItem('oldiberdi_cache',JSON.stringify({acc:{id:S.acc.id},people:Object.values(S.people),tx:Object.values(S.tx),confirms:S.confirms}))}catch(e){}}

async function bioCheck(){try{if(window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)BIO.ok=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()}catch(e){BIO.ok=false}}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
function bioGet(){try{const v=JSON.parse(LS.get('oldiberdi_bio')||'null');return v&&S.acc&&v.acc===S.acc.id?v:null}catch(e){return null}}
async function bioEnable(){try{const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Oldi-Berdi'},user:{id:new TextEncoder().encode(S.acc.id.slice(0,64)),name:S.acc.phone,displayName:S.acc.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});if(!cred)throw new Error('none');if(!LS.set('oldiberdi_bio',JSON.stringify({acc:S.acc.id,cred:b64(cred.rawId)})))throw new Error('storage');return true}catch(e){toast(e&&e.name==='NotAllowedError'?"Barmoq izi yoqilmadi. PIN kod bilan kirasiz.":"Bu qurilmada barmoq izini yoqib bo'lmadi. PIN kod bilan kirasiz.");return false}}
async function bioVerify(){const b=bioGet();if(!b)return false;try{const r=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(b.cred),transports:['internal']}],userVerification:'required',timeout:60000}});return !!r}catch(e){return false}}

 if(st.step==='pin2'){if(pin!==st.first){st.step='pin1';st.first='';S.pinErr="PIN mos kelmadi. Qaytadan o'ylab toping";S.pinBuf='';render();return}
  const salt=uid();const {id,...rest}=S.acc;const data={...rest,pinSalt:salt,pinHash:await hashPw(pin,salt)};
  try{const j=await api('setPin',{pinSalt:data.pinSalt,pinHash:data.pinHash});setAcc(j.acc)}catch(e){S.pinErr=writeErr(e);S.pinBuf='';render();return}
  S.pinBuf='';if(st.mode==='new'&&BIO.ok&&!bioGet()){st.step='bio';render();return}
  S.setup=null;render();toast(st.mode==='new'?"PIN kod o'rnatildi":'PIN kod yangilandi');maybeNew()}
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const NUMW={bir:1,ikki:2,uch:3,"to'rt":4,tort:4,besh:5,olti:6,yetti:7,sakkiz:8,"to'qqiz":9,toqqiz:9,"o'n":10,yigirma:20,"o'ttiz":30,ottiz:30,qirq:40,ellik:50,oltmish:60,yetmish:70,sakson:80,"to'qson":90,toqson:90};
function parseNum(s){
 s=s.replace(/(\d)[\s.](?=\d{3}(?!\d))/g,'$1').replace(/(\d)[\s.](?=\d{3}(?!\d))/g,'$1').replace(/(\d),(\d)/g,'$1.$2');
 let total=0,curv=0,half=false,found=false;
 for(let w of s.split(/[\s,;]+/)){w=w.replace(/[^0-9a-z'.$]/g,'').replace(/^\$/,'');if(!w)continue;
  const m=w.match(/^(\d+(?:\.\d+)?)(k|ming|mln|million)?$/);
  if(m){curv+=parseFloat(m[1]);found=true;if(m[2]){total+=curv*(m[2]==='k'||m[2]==='ming'?1e3:1e6);curv=0}continue}
  if(w==='yarim'){half=true;found=true;continue}
  if(NUMW[w]!=null){curv+=NUMW[w];found=true;continue}
  if(w==='yuz'){curv=(curv||1)*100;found=true;continue}
  const mul=/^ming/.test(w)?1e3:/^(million|mln|millon)/.test(w)?1e6:/^(milliard|mlrd)/.test(w)?1e9:0;
  if(mul){total+=((curv||0)+(half?0.5:0)||1)*mul;curv=0;half=false;found=true;continue}
 }
 total+=curv+(half&&!curv?0:0);return found?Math.round(total*100)/100:0}
function normName(x){return String(x||'').toLowerCase().replace(/[’‘`ʻʼ']/g,'').replace(/\s+/g,' ').trim()}
function parseQuick(raw){
 const low=' '+raw.toLowerCase().replace(/[’‘`ʻʼ]/g,"'")+' ';
 let type='lend';
 if(/qaytardim|to'ladim|uzdim/.test(low))type='paid';else if(/qaytardi|to'ladi|uzdi/.test(low))type='got';else if(/\boldim\b|qarz oldim|qarzga oldim|olgandim/.test(low))type='borrow';
 const usd=/dollar|\$|usd|долл/.test(low);
 const amount=parseNum(low.split(/muddat/)[0]);
 const txt=normName(raw),words=txt.split(' ');let best=null;
 for(const p of Object.values(S.people)){const pn=normName(p.name);const first=pn.split(' ')[0];if(first.length<2)continue;
  if(txt.includes(pn)){if(!best||pn.length>best.len)best={p,len:pn.length}}
  else if(words.some(w=>w.startsWith(first)&&w.length-first.length<=5)){if(!best||first.length>best.len)best={p,len:first.length}}}
 let name='';
 if(!best){const stop=/^(qarz|qarzga|ming|million|mln|yuz|dollar|berdim|oldim|qaytardi|qaytardim|bugun|kecha|som|so'm|sum|ga|dan|va|uchun)$/i;
  const w=raw.trim().split(/\s+/).find(x=>/^[^\d\s$]{2,}/.test(x)&&!stop.test(x.replace(/[,.!?]/g,''))&&!NUMW[x.toLowerCase()]);
  if(w){name=w.replace(/[,.!?]/g,'').replace(/(ga|ka|qa|dan|ning|ni|da)$/i,'');name=name.charAt(0).toUpperCase()+name.slice(1)}}
 return {type,amount,cur:usd&&usdOn()?'USD':'',pid:best?best.p.id:null,name}}

 if(phone&&(phone.length<7||phone.length>15))return err.textContent="Telefon raqam noto'g'ri";
 const dup=Object.values(S.people).find(p=>p.id!==PD.id&&((phone&&p.phone===phone)||p.name.toLowerCase()===name.toLowerCase()));
 if(dup&&!btn.dataset.force){err.innerHTML=`«${esc(dup.name)}» allaqachon bor. Baribir yaratish uchun yana bosing.`;btn.dataset.force='1';return}
 const now=Date.now();const id=PD.id||uid();const prev=PD.id?S.people[id]:null;
 const log=(prev?.log||[]).slice(-29);
 if(prev){if(prev.name!==name)log.push({at:now,t:`Ism: ${prev.name} → ${name}`});if((prev.phone||'')!==phone)log.push({at:now,t:`Telefon: ${prev.phone?fphone(prev.phone):'—'} → ${phone?fphone(phone):'—'}`});if((prev.photo||'')!==PD.photo)log.push({at:now,t:PD.photo?'Rasm yangilandi':"Rasm olib tashlandi"});if((prev.note||'')!==note)log.push({at:now,t:'Izoh o\'zgardi'})}else log.push({at:now,t:'Yaratildi'});
 const data={name,phone,note,photo:PD.photo||'',createdAt:prev?.createdAt||now,updatedAt:now,log};
 const item={id,...data};
 S.people[id]=item;compute();saveCache();closeSheet();
 if(PD.forTx&&TX){TX.pid=id;const box=$('#tx-person');if(box)box.innerHTML=personPickHtml();setTimeout(()=>{const a=$('#tx-amount');a&&a.focus()},100)}
 toast(prev?'Saqlandi':`${name} qo'shildi`);render();
 bg('Odam saqlanmadi',async()=>{const j=await api('savePerson',{item});if(data.photo.startsWith('data:')&&j.item.photo)PH[j.item.photo]=data.photo;if(S.people[id])S.people[id]=j.item;compute();saveCache();if(!isTyping())render()},()=>{if(prev)S.people[id]=prev;else delete S.people[id]});
}

/* --- profile --- */
let PR=null;
function profileForm(){const a=S.acc;PR={photo:a.photo||''};
 openSheet("Ma'lumotlarim",`<form data-form="profile"><label class="ava-pick"><input type="file" accept="image/*" data-photo="profile"><span id="ph-profile">${avatar(a,88)}</span><span class="cam">${I.cam}</span><span class="hint">Rasmni almashtirish</span></label>
 <div class="field"><label for="pr-name">Ism</label><input class="inp" id="pr-name" value="${esc(a.name)}" required></div>
 <div class="field"><label for="pr-phone">Telefon raqam (kirish uchun)</label><input class="inp num" id="pr-phone" type="tel" inputmode="tel" value="${esc(fphone(a.phone))}"></div>
 <div class="err" id="pr-err"></div><button class="btn btn-primary" id="pr-save">Saqlash</button></form>`)}
async function saveProfile(){const err=$('#pr-err'),btn=$('#pr-save');err.textContent='';
 const name=$('#pr-name').value.trim(),phone=normPhone($('#pr-phone').value);
 if(name.length<2)return err.textContent='Ismni yozing';if(phone.length<9||phone.length>15)return err.textContent="Telefon raqam noto'g'ri";
 btn.disabled=true;btn.textContent='Saqlanmoqda…';
 try{const j=await api('saveProfile',{name,phone,photo:PR.photo||''});if((PR.photo||'').startsWith('data:')&&j.acc.photo)PH[j.acc.photo]=PR.photo;setAcc(j.acc);closeSheet();render();toast('Saqlandi')
 }catch(e){err.textContent=writeErr(e)}finally{btn.disabled=false;btn.textContent='Saqlash'}}
function passForm(){openSheet("Parolni o'zgartirish",`<form data-form="pass"><div class="field"><label for="pw-old">Hozirgi parol</label>${pwInp('pw-old','old','current-password')}</div><div class="field"><label for="pw-new">Yangi parol</label>${pwInp('pw-new','new','new-password')}</div><div class="field"><label for="pw-new2">Yangi parolni takrorlang</label>${pwInp('pw-new2','new2','new-password')}</div><div class="err" id="pw-err"></div><button class="btn btn-primary" id="pw-save">Parolni yangilash</button></form>`)}
async function savePass(){const err=$('#pw-err'),btn=$('#pw-save');err.textContent='';const o=$('#pw-old').value,n=$('#pw-new').value,n2=$('#pw-new2').value;
 if(!o)return err.textContent='Hozirgi parolni kiriting';if(n.length<4)return err.textContent="Yangi parol kamida 4 belgi bo'lsin";if(n!==n2)return err.textContent='Yangi parollar bir xil emas';
 btn.disabled=true;try{await api('changePass',{old:o,new:n});closeSheet();toast('Parol yangilandi')}catch(e){err.textContent=writeErr(e);btn.disabled=false}}
function currencyForm(){const opts=["so'm",'$','€','₽','₸'];openSheet('Valyuta',`<p class="hint" style="margin-top:0">Summalar yonida ko'rsatiladigan belgi. Eski yozuvlar summasi o'zgarmaydi.</p><div class="chips" style="flex-wrap:wrap">${opts.map(o=>`<button class="chip ${cur()===o?'on':''}" data-act="setCur" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`)}

/* ============ events ============ */
const A={
 authTab:d=>{S.authTab=d.v;renderAuth()},
 eye:(d,el)=>{const i=el.parentElement.querySelector('input');const show=i.type==='password';i.type=show?'text':'password';i.classList.add('pw');el.classList.toggle('on',show);el.innerHTML=show?I.eyeOff:I.eye;el.setAttribute('aria-label',show?'Parolni yashirish':"Parolni ko'rsatish")},
 go:d=>{closeAllSheets();S.view=d.v;render()},
 peopleFilter:d=>{S.pf=d.v;S.view='people';render()},
 pf:d=>{S.pf=d.v;render()},hf:d=>{S.hf=d.v;render()},
 openPerson:d=>{closeAllSheets();S.pid=d.id;S.view='person';render()},
 newTx:d=>{if(!S.loaded.p){toast('Ma\'lumotlar yuklanmoqda…');return}txForm({type:d.type,pid:d.pid||(S.view==='person'?S.pid:null)})},
 txType:d=>{TX.type=d.v;$('#tx-seg').innerHTML=segHtml();syncDue()},
 txCur:(d,el)=>{TX.cur=TX.cur==='USD'?'':'USD';el.textContent=TX.cur==='USD'?'$':"so'm";planPreview();convHint()},
 mic:(d,el)=>{if(!SR)return;if(S.rec){try{S.rec.stop()}catch(e){}return}const inp=$('#qk');const r=new SR();r.lang='uz-UZ';r.interimResults=true;r.maxAlternatives=1;S.rec=r;el.classList.add('on');inp.value='';inp.placeholder='Gapiring…';
  r.onresult=e=>{let x='';for(const res of e.results)x+=res[0].transcript;inp.value=x};
  r.onerror=e=>{toast(e.error==='not-allowed'||e.error==='service-not-allowed'?"Mikrofonga ruxsat bering":"Ovozni tanib bo'lmadi — yozib kiriting")};
  r.onend=()=>{S.rec=null;el.classList.remove('on');inp.placeholder="Tez yozish: «Akmalga 500 ming berdim»";if(inp.value.trim())doQuick()};
  try{r.start()}catch(e){S.rec=null;el.classList.remove('on')}},
 remind:d=>{const p=S.people[d.id];if(!p)return;S.shareCtx={kind:'remind',pid:p.id};shareSheet('Eslatma yuborish',`${esc(p.name)}ga qarz haqida muloyim eslatma. Matnni xohlaganingizcha o'zgartiring.`,remindText(p),p.phone)},
 shareConfirm:async(d,el)=>{const t=S.tx[d.id];if(!t)return;const p=S.people[t.pid]||{name:''};el.disabled=true;const old=el.innerHTML;el.textContent='Havola tayyorlanmoqda…';
  try{await QCHAIN;const j=await api('shareTx',{id:d.id});S.confirms[d.id]={status:j.status,token:j.token};saveCache();
   const amt=amtTxt(t);const me=S.acc.name;const desc=t.type==='lend'?`${me} sizga ${amt} qarz berdi`:t.type==='borrow'?`${me} sizdan ${amt} qarz oldi`:t.type==='got'?`siz ${me}ga ${amt} qaytardingiz`:`${me} sizga ${amt} qaytardi`;
   const text=`Assalomu alaykum, ${p.name}!

Oldi-Berdi'da yozuv: ${desc} (${fdate(t.date)}).
Iltimos, to'g'riligini tasdiqlang:
${confirmLink(j.token)}`;
   S.shareCtx={kind:'confirm',id:d.id};closeSheet();shareSheet('Tasdiqlashga yuborish',`Havolani ${esc(p.name)}ga yuboring. U ochib, «Ha, to'g'ri» tugmasini bosadi va yozuv ikki tomonlama tasdiqlanadi.`,text,p.phone)}
  catch(e){toast(writeErr(e));el.disabled=false;el.innerHTML=old}},
 shareVia:async(d)=>{const text=($('#sh-text')||{}).value||'';
  if(d.v==='copy'){try{await navigator.clipboard.writeText(text);toast('Nusxalandi')}catch(e){const ta=$('#sh-text');ta.select();toast('Matnni belgilab nusxalang')}}
  else if(d.v==='tg'){window.open('https://t.me/share/url?url='+encodeURIComponent(text),'_blank')}
  else if(d.v==='sms'){location.href='sms:+'+d.ph+'?&body='+encodeURIComponent(text)}
  else if(d.v==='any'){try{await navigator.share({text})}catch(e){return}}
  const c=S.shareCtx;if(c&&c.kind==='remind'&&d.v!=='copy'){const p=S.people[c.pid];if(p){const now=Date.now();const {id,...rest}=p;const item={id,...rest,log:[...(p.log||[]).slice(-29),{at:now,t:'Eslatma yuborildi ('+({tg:'Telegram',sms:'SMS',any:'ulashish'}[d.v])+')'}],updatedAt:now};S.people[id]=item;saveCache();bg('Eslatma tarixi saqlanmadi',()=>api('savePerson',{item}))}}},
 cfAnswer:async(d,el)=>{el.disabled=true;try{const j=await api('answerConfirm',{c:CF.c,answer:d.v});CF.d.status=j.status;drawConfirm();toast(j.status==='confirmed'?'Rahmat! Tasdiqlandi':'Javobingiz yuborildi')}catch(e){toast(writeErr(e));el.disabled=false}},
 cfMirror:async(d,el)=>{el.disabled=true;el.textContent='Qo\'shilmoqda…';try{await api('mirrorConfirm',{c:CF.c});CF.state='mirrored';drawConfirm()}catch(e){toast(writeErr(e));el.disabled=false}},
 txPick:d=>{TX.pid=d.id;$('#tx-person').innerHTML=personPickHtml();setTimeout(()=>$('#tx-amount')?.focus(),50)},
 txUnpick:()=>{TX.pid=null;$('#tx-person').innerHTML=personPickHtml();setTimeout(()=>$('#tx-q')?.focus(),50)},
 txContact:async()=>{const r=await pickContacts(false);if(!r.length)return;const c=r[0];const ex=Object.values(S.people).find(p=>(c.phone&&p.phone===c.phone)||p.name.toLowerCase()===c.name.toLowerCase());if(ex){TX.pid=ex.id;$('#tx-person').innerHTML=personPickHtml()}else personForm({name:c.name,phone:c.phone,forTx:true})},
 pfContact:async()=>{const r=await pickContacts(false);if(!r.length)return;const c=r[0];if(c.name)$('#pf-name').value=c.name;if(c.phone)$('#pf-phone').value=fphone(c.phone)},
 importContacts:async()=>{const r=await pickContacts(true);if(!r.length)return;let n=0;for(const c of r){if(Object.values(S.people).some(p=>(c.phone&&p.phone===c.phone)||p.name.toLowerCase()===c.name.toLowerCase()))continue;const now=Date.now();try{const j=await api('savePerson',{item:{id:uid(),name:c.name||fphone(c.phone),phone:c.phone,note:'',photo:'',createdAt:now,log:[{at:now,t:'Kontaktdan qo\'shildi'}]}});S.people[j.item.id]=j.item;compute();render();n++}catch(e){toast(writeErr(e));break}}toast(n?`${n} ta odam qo'shildi`:"Hammasi allaqachon ro'yxatda")},
 txView:d=>txView(d.id),
 txEdit:d=>{closeSheet();txForm({id:d.id})},
 txDel:d=>confirmSheet("Yozuvni o'chirish","Bu yozuv butunlay o'chiriladi va balans qayta hisoblanadi.","O'chirish",async()=>{const old=S.tx[d.id];delete S.tx[d.id];compute();saveCache();closeAllSheets();render();toast("O'chirildi");bg("O'chirilmadi",()=>api('deleteTx',{id:d.id}),()=>{if(old)S.tx[d.id]=old})}),
 newPerson:d=>personForm({name:d.name||'',forTx:d.for==='tx'}),
 editPerson:d=>personForm({id:d.id}),
 delPerson:d=>{const p=S.people[d.id];const n=Object.values(S.tx).filter(t=>t.pid===d.id);confirmSheet(`${p.name} o'chirilsinmi?`,`Uning ${n.length} ta yozuvi ham o'chiriladi. Buni qaytarib bo'lmaydi.`,"O'chirish",async()=>{n.forEach(t=>delete S.tx[t.id]);delete S.people[d.id];compute();saveCache();bg("O'chirilmadi",()=>api('deletePerson',{id:d.id}),()=>{S.people[d.id]=p;n.forEach(t=>S.tx[t.id]=t)});S.view='people';render();toast("O'chirildi")})},
 viewImg:async d=>{const [k,id]=d.src.split(':');const v0=k==='tx'?S.tx[id]?.photo:S.people[id]?.photo;if(!v0)return;const src=phSrc(v0)||await loadPh(v0);if(!src){toast("Rasmni yuklab bo'lmadi");return}const v=document.createElement('div');v.className='viewer';v.innerHTML=`<img src="${esc(src)}" alt="">`;v.onclick=()=>v.remove();document.body.appendChild(v)},
 rmPhoto:(d,el,e)=>{e.preventDefault();if(d.k==='tx'){TX.photo='';el.closest('.field').querySelector('.photo-pick').outerHTML=photoPickHtml('tx','')}},
 copy:async d=>{try{await navigator.clipboard.writeText(d.v);toast('Raqam nusxalandi')}catch(e){toast(d.v)}},
 editProfile:()=>profileForm(),changePass:()=>passForm(),currency:()=>currencyForm(),
 setCur:async d=>{try{const j=await api('setCurrency',{currency:d.v});setAcc(j.acc);closeSheet();render();toast('Valyuta: '+d.v)}catch(e){toast(writeErr(e))}},
 logout:()=>confirmSheet('Chiqish','Akkauntdan chiqasizmi? Keyin raqam va parol bilan qayta kirasiz.','Chiqish',async()=>{logout()}),
 closeSheet:()=>closeSheet(),
 contactDev:()=>{const ph=normPhone(DEV.phone);openSheet('Dasturchiga murojaat',`<p class="hint" style="margin:0">Ilova bo'yicha savol, taklif yoki muammo bo'lsa, qulay usulni tanlang.</p><div class="copts">${ph?`<a class="copt" href="tel:+${ph}"><span class="qi t-lend">${I.phone}</span><span><b>Qo'ng'iroq qilish</b><small class="num">${fphone(ph)}</small></span><span class="go">${I.left}</span></a>`:''}<a class="copt" href="https://t.me/${esc(DEV.telegram)}" target="_blank" rel="noopener"><span class="qi" style="background:#e2f2fb;color:#1c8fca">${I.send}</span><span><b>Telegram'da yozish</b><small>@${esc(DEV.telegram)}</small></span><span class="go">${I.left}</span></a></div>`)},
 pinKey:d=>{if(S.pinBusy||S.pinBuf.length>=4)return;S.pinBuf+=d.v;S.pinErr='';render();if(S.pinBuf.length===4){S.pinBusy=true;setTimeout(async()=>{try{await pinDone()}finally{S.pinBusy=false}},150)}},
 pinDel:()=>{if(S.pinBusy)return;S.pinBuf=S.pinBuf.slice(0,-1);S.pinErr='';render()},
 bioUnlock:async()=>{if(await bioVerify()){S.locked=false;S.pinBuf='';S.pinTries=0;render();maybeNew()}else toast('Barmoq izi tasdiqlanmadi. PIN kodni kiriting.')},
 bioSetup:async()=>{if(await bioEnable())toast('Barmoq izi yoqildi');S.setup=null;render();maybeNew()},
 bioSkip:()=>{S.setup=null;render();toast("PIN kod o'rnatildi");maybeNew()},
 forgotPin:()=>{logout();toast('Telefon raqam va parolingiz bilan kiring')},
 pinCancel:()=>{S.setup=null;S.pinBuf='';S.pinErr='';render()},
 changePin:()=>{S.setup={step:S.acc.pinHash?'cur':'pin1',mode:'change'};S.pinBuf='';S.pinErr='';render()},
 toggleBio:async()=>{if(bioGet()){LS.del('oldiberdi_bio');toast("Barmoq izi o'chirildi")}else if(await bioEnable())toast('Barmoq izi yoqildi');render()},
 lockNow:()=>{if(!S.acc.pinHash)return;S.locked=true;S.pinBuf='';S.pinErr='';render()},
 setAva:async(d,el)=>{const t=S.tx[d.id];if(!t)return;el.disabled=true;if(await touchPerson(t.pid,t.photo,true)){el.remove();toast('Profil rasmi qo\'yildi')}else el.disabled=false},
 reloadApp:(d,el)=>{el.disabled=true;el.textContent='Yuklanmoqda…';let done=false;const go=()=>{if(done)return;done=true;location.reload()};const c=navigator.serviceWorker&&navigator.serviceWorker.controller;if(!c)return go();const ch=new MessageChannel();ch.port1.onmessage=go;c.postMessage('refresh',[ch.port2]);setTimeout(go,6000)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==='BUTTON'&&el.type!=='submit')e.preventDefault();f(el.dataset,el,e)});
document.addEventListener('change',e=>{if(e.target.id==='tx-plan-on'&&TX){TX.planOn=e.target.checked;const b=$('#tx-plan-box');if(b)b.hidden=!TX.planOn;syncDue()}});
document.addEventListener('submit',e=>{e.preventDefault();const k=e.target.dataset.form;({quick:doQuick,login:doLogin,register:doRegister,tx:saveTx,person:savePerson,profile:saveProfile,pass:savePass})[k]?.(e.target)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.input==='pq'){S.pq=t.value;render._focus='pq';render()}
 else if(t.dataset.input==='hq'){S.hq=t.value;render._focus='hq';render()}
 else if(t.dataset.input==='txq'){$('#tx-sugg').innerHTML=suggHtml(t.value)}
 if(t.hasAttribute('data-plan')){setTimeout(()=>{planPreview();convHint()},0)}
 if(t.hasAttribute('data-amount')){let v=t.value.replace(/[^\d.,]/g,'').replace('.',',');const [i,...f]=v.split(',');const ii=i.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,' ');t.value=ii+(f.length?','+f.join('').slice(0,2):'')}
});
document.addEventListener('keydown',e=>{if(S.acc&&(S.locked||S.setup)&&!sheets.length){if(/^\d$/.test(e.key)){A.pinKey({v:e.key});return}if(e.key==='Backspace'){A.pinDel();return}}if(e.key==='Escape'){const v=$('.viewer');if(v)v.remove();else closeSheet()}if(e.key==='Enter'&&e.target.id==='tx-q'){e.preventDefault();const first=$('#tx-sugg [data-act]');first&&first.click()}});
document.addEventListener('change',async e=>{const t=e.target;const k=t.dataset.photo;if(!k||!t.files||!t.files[0])return;
 try{const url=await compressImage(t.files[0]);
  if(k==='tx'){TX.photo=url;t.closest('.photo-pick').outerHTML=photoPickHtml('tx',url)}
  else if(k==='person'){PD.photo=url;$('#ph-person').innerHTML=avatar({photo:url},88)}
  else if(k==='profile'){PR.photo=url;$('#ph-profile').innerHTML=avatar({photo:url},88)}
 }catch(err){toast("Rasmni o'qib bo'lmadi")}});

/* ============ boot ============ */
(async function boot(){
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 await bioCheck();
 if(!API_URL){$('#app').innerHTML=`<div class="auth"><div class="auth-top pad">${LOGO}<h1>Oldi<span>-</span>Berdi</h1><p>Ilova hali serverga ulanmagan.</p></div><div class="pad"><div class="auth-card"><b>Sozlash kerak</b><p class="hint">GitHub'dagi <b>config.js</b> faylini oching va Google Apps Script'dan olgan havolani qo'shtirnoq ichiga yozing.</p></div></div></div>`;return}
 const cParam=new URLSearchParams(location.search).get('c');
 if(cParam){renderConfirm(cParam);return}
 let a=null;try{a=JSON.parse(LS.get('oldiberdi_acc')||'null')}catch(e){}
 if(S.token&&a&&a.id){startSession(a,true);return}
 renderAuth();
})();
</script>
