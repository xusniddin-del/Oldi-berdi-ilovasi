<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one phone-width column; green hero header like the reference poster, white cards, bottom tab bar with a raised + button */
:root{
  --bg:#edf5ef; --surface:#ffffff; --surface-2:#f3f8f4; --fg:#0e2a1b; --muted:#5b7465; --line:#dbe7de;
  --brand:#13894a; --brand-deep:#0b5c33; --lime:#bff26f; --on-brand:#ffffff;
  --hero-a:#0b5c33; --hero-b:#1a9c55;
  --pos:#119a55; --pos-bg:#e3f6ea; --neg:#d9502f; --neg-bg:#fdebe5; --teal:#0f8f8a; --teal-bg:#e0f4f3; --plum:#7b56c9; --plum-bg:#efe9fb;
  --warn:#c98a06; --warn-bg:#fff4d9;
  --shadow:0 10px 30px -12px rgba(11,70,38,.28);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06140c; --surface:#0e2217; --surface-2:#132c1e; --fg:#e6f4ea; --muted:#8eae9a; --line:#1d3b29;
  --brand:#28b866; --brand-deep:#1a8a4b; --lime:#c4f57a; --on-brand:#04130a;
  --hero-a:#07301b; --hero-b:#0f6a39;
  --pos:#3fd282; --pos-bg:#123a24; --neg:#ff8366; --neg-bg:#3a1c14; --teal:#45cfc8; --teal-bg:#0f3533; --plum:#b49bf0; --plum-bg:#2a2140;
  --warn:#f2c14e; --warn-bg:#3a2e0e;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#06140c; --surface:#0e2217; --surface-2:#132c1e; --fg:#e6f4ea; --muted:#8eae9a; --line:#1d3b29;
  --brand:#28b866; --brand-deep:#1a8a4b; --lime:#c4f57a; --on-brand:#04130a;
  --hero-a:#07301b; --hero-b:#0f6a39;
  --pos:#3fd282; --pos-bg:#123a24; --neg:#ff8366; --neg-bg:#3a1c14; --teal:#45cfc8; --teal-bg:#0f3533; --plum:#b49bf0; --plum-bg:#2a2140;
  --warn:#f2c14e; --warn-bg:#3a2e0e;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.ava{position:relative}
.ava img{position:absolute;inset:0}
html,body{height:100%;overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* splash & auth */
.splash{min-height:100vh;display:grid;place-items:center;text-align:center;color:#fff;background:linear-gradient(160deg,var(--hero-a),var(--hero-b))}
.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(150deg,#2fd17a,#0f7a41);display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);margin:0 auto}
.logo svg{width:44px;height:44px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 0.9s linear infinite;margin:18px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
.auth{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(170deg,var(--hero-a) 0,var(--hero-b) 330px,var(--bg) 331px)}
.auth-top{color:#fff;text-align:center;padding-block:40px 28px}
.auth-top h1{font-size:30px;margin:14px 0 2px;letter-spacing:-.02em;font-weight:800}
.auth-top h1 span{color:var(--lime)}
.auth-top p{margin:0;opacity:.85}
.auth-card{background:var(--surface);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:28px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px -3px rgba(0,0,0,.2)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.feat div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:13px;color:var(--muted)}
.feat b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--brand)}
textarea.inp{resize:vertical;min-height:70px}
.inp-wrap{position:relative}
.inp-wrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:8px;color:var(--muted);display:grid;place-items:center;border-radius:10px}
.inp-wrap .eye svg{width:20px;height:20px;display:block}
.inp-wrap .eye.on{color:var(--brand)}
.inp-wrap input[type=password],.inp-wrap input.pw{padding-right:46px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.inp{min-width:0}
input[type=date].inp{-webkit-appearance:none;appearance:none;min-height:50px;padding-inline:12px;font-size:15px}
.field>label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:359px){.quick{gap:4px}.quick button{font-size:11px}.qi{width:46px;height:46px;border-radius:15px}.seg button small{display:none}.nav button{font-size:10px}.ni{padding:4px 8px}.sheet-head h3{font-size:17px}}
@media (orientation:landscape) and (max-height:500px){.sheet{max-height:96vh}.hero{padding-block:12px 66px}}
.amount-inp{font-size:28px;font-weight:800;letter-spacing:-.02em;padding:14px 64px 14px 14px}
.cur-tag{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;width:min(448px,calc(100% - 32px));display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:10px 10px 10px 14px;border-radius:16px;box-shadow:var(--shadow);animation:su .25s}
.upd span{flex:1;font-size:13.5px;font-weight:600;line-height:1.3}
.upd .btn{background:var(--lime);color:#0b2a17;padding:9px 14px;font-size:13.5px;border-radius:11px}
.new-list{margin:0 0 14px;padding-left:20px;color:var(--fg)}
.new-list li{margin-bottom:6px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-primary{background:var(--brand);color:var(--on-brand);width:100%}
.btn-ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn-danger{background:var(--neg-bg);color:var(--neg)}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:11px}
.err{color:var(--neg);font-size:13px;font-weight:600;min-height:18px;margin:-4px 0 10px}
.hint{font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 10px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.seg button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;line-height:1.25}
.seg button.on{border-color:var(--brand);background:var(--pos-bg)}

/* hero (home) */
.hero{background:linear-gradient(165deg,var(--hero-a),var(--hero-b));color:#fff;padding-block:18px 74px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(191,242,111,.28),transparent 70%)}
.hero-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.greet{opacity:.8;font-size:14px}
.hname{font-size:clamp(18px,5.6vw,21px);line-height:1.25;font-weight:800;letter-spacing:-.01em}
.mode-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);padding:4px 9px;border-radius:99px;margin-top:6px}
.mode-pill i{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.mode-pill.off i{background:#ffc35a}
.bal-card{background:var(--surface);color:var(--fg);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-top:-58px;position:relative;z-index:2}
.bal-label{font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.bal-big{font-size:clamp(23px,8vw,32px);overflow-wrap:anywhere;font-weight:800;letter-spacing:-.03em;margin:2px 0 2px}
.bal-sub{font-size:13px;color:var(--muted)}
.bal-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;font-weight:700;color:var(--muted)}
.tile b{font-size:clamp(14px,4.2vw,18px);letter-spacing:-.02em;overflow-wrap:anywhere}
.tile small{color:var(--muted);font-size:12px}
.tile.p{background:var(--pos-bg)} .tile.p b{color:var(--pos)}
.tile.n{background:var(--neg-bg)} .tile.n b{color:var(--neg)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--fg);padding:4px 0}
.qi{width:52px;height:52px;border-radius:17px;display:grid;place-items:center}
.qi svg{width:24px;height:24px}
.t-lend{background:var(--pos-bg);color:var(--pos)} .t-borrow{background:var(--neg-bg);color:var(--neg)}
.t-got{background:var(--teal-bg);color:var(--teal)} .t-paid{background:var(--plum-bg);color:var(--plum)}

/* sections & lists */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.sec-head h2{font-size:17px;margin:0;letter-spacing:-.01em}
.link{color:var(--brand);font-weight:700;font-size:13.5px;padding:4px}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex-shrink:0}
.item .r b{display:block;font-size:15px}
.item .r small{font-size:11.5px;color:var(--muted)}
.ticon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;position:relative}
.ticon svg{width:20px;height:20px}
.thumb-dot{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.thumb-dot svg{width:11px;height:11px}
.ava{border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden;background:var(--brand)}
.ava img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;letter-spacing:.02em;vertical-align:2px}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.empty .ei{width:60px;height:60px;border-radius:20px;background:var(--pos-bg);color:var(--brand);display:grid;place-items:center;margin:0 auto 10px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.date-sep{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.topbar h1{font-size:22px;margin:0;flex:1;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--fg);flex-shrink:0}
.icon-btn svg{width:20px;height:20px}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .inp{padding-left:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* person page */
.p-head{text-align:center;padding-block:4px 6px}
.p-head h2{margin:10px 0 2px;font-size:22px;letter-spacing:-.02em}
.p-phone{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-weight:600;white-space:nowrap}
.p-phone svg{width:16px;height:16px;flex-shrink:0}
.p-bal{margin:14px 0 4px;padding:14px;border-radius:18px;text-align:center}
.p-bal span{font-size:13px;font-weight:700}
.p-bal b{display:block;font-size:28px;letter-spacing:-.03em}
.p-bal.p{background:var(--pos-bg);color:var(--pos)} .p-bal.n{background:var(--neg-bg);color:var(--neg)} .p-bal.z{background:var(--surface-2);color:var(--muted)}
.p-note{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:13.5px;color:var(--muted);margin-top:10px;text-align:left;white-space:pre-wrap}
.log{font-size:12.5px;color:var(--muted);padding:10px 14px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.log:last-child{border-bottom:0}

/* bottom nav */
.spacer{height:calc(96px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none}
.nav-in{max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;pointer-events:auto;padding:6px max(8px,env(safe-area-inset-left,0px)) 8px max(8px,env(safe-area-inset-right,0px));box-shadow:0 -8px 24px -18px rgba(0,0,0,.4)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:12px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand)}
.nav button.on .ni{background:var(--pos-bg)}
.ni{padding:4px 14px;border-radius:12px;display:grid;place-items:center}
.fab{width:58px;height:58px;border-radius:50%;background:linear-gradient(150deg,#2fd17a,var(--brand-deep));color:#fff;display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 10px 22px -8px rgba(11,92,51,.7);border:4px solid var(--surface)}
.fab svg{width:26px;height:26px}
.nav .fab{color:#fff;padding:0;border-radius:50%;display:grid}
.nav .fab svg{width:26px;height:26px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(4,20,11,.5);animation:fi .2s}
.sheet{position:relative;width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:su .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:19px;letter-spacing:-.01em}
.tg-btn{background:linear-gradient(150deg,#2aa6e0,#1c7fc0)!important}
.pin-skip{width:auto;min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0 28px;border-radius:14px;font-size:15px;text-decoration:none!important;opacity:1!important}
@keyframes su{from{transform:translateY(40px);opacity:0}}
@keyframes fi{from{opacity:0}}
/* ============ katta ekran (kompyuter) ============ */
.side-logo,.fab-l,.side-foot{display:none}
.main{touch-action:pan-y pinch-zoom}
.auth-top{position:relative}
.site-back{position:absolute;top:14px;left:12px;display:inline-flex;align-items:center;gap:6px;color:#fff;opacity:.85;font-weight:700;font-size:13px;text-decoration:none;padding:6px 8px;border-radius:10px}
.auth-top:has(.site-back){padding-top:56px}
.site-back:hover{opacity:1}.site-back svg{width:16px;height:16px}
@media (min-width:1000px){
 .auth{display:grid;grid-template-columns:minmax(420px,1fr) minmax(460px,1fr);min-height:100vh;background:var(--bg)}
 .auth-top{background:radial-gradient(70% 60% at 80% 10%,rgba(191,242,111,.18),transparent 70%),linear-gradient(160deg,var(--hero-a),var(--hero-b));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;position:relative;overflow:hidden}
 .auth-top:after{content:"";position:absolute;right:-110px;bottom:-110px;width:360px;height:360px;border-radius:50%;border:56px solid rgba(191,242,111,.1)}
 .auth-top .logo{transform:scale(1.6);margin-bottom:22px}
 .auth-top h1{font-size:46px}
 .auth-top p{font-size:18px}
 .auth-top .lang-sw{position:absolute;top:24px;left:24px;z-index:2}
 .auth>.pad{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px}
 .auth-card{width:100%;max-width:440px;padding:28px;margin-bottom:22px}
 .auth .feat{width:100%;max-width:440px;margin:0}
 #app:has(.nav){max-width:none;padding-left:252px}
 #app:has(.auth){max-width:none}
 .main{max-width:1060px;margin:0 auto;padding:0 28px}
 .main .pad{padding-left:0;padding-right:0}
 .spacer{height:40px}
 .nav{top:0;right:auto;width:252px;padding:0}
 .nav-in{max-width:none;height:100%;margin:0;display:flex;flex-direction:column;align-items:stretch;gap:4px;border-top:0;border-right:1px solid var(--line);padding:22px 16px;box-shadow:none}
 .side-logo{order:-2;display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-size:19px;letter-spacing:-.02em}

/* ---------- ochilish animatsiyasi ---------- */
#intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;color:#fff;
 background:radial-gradient(60% 45% at 50% 42%,rgba(191,242,111,.22),transparent 70%),linear-gradient(160deg,#0b5c33,#13894a 55%,#1a9c55);
 transition:opacity .38s ease,transform .45s cubic-bezier(.4,0,.2,1)}
#intro.out{opacity:0;transform:scale(1.06);pointer-events:none}
html.no-intro #intro{display:none}
#intro .ring{position:absolute;left:50%;top:42%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(191,242,111,.45);opacity:0;animation:inRing 1.6s .25s cubic-bezier(.2,.7,.2,1) forwards}
#intro .ring.r2{animation-delay:.55s;border-color:rgba(255,255,255,.3)}
#intro .box{position:relative;text-align:center;margin-top:-6vh}
#intro .tile{width:112px;height:112px;margin:0 auto;border-radius:32px;background:linear-gradient(150deg,#2fd17a,#0f7a41);display:grid;place-items:center;
 box-shadow:0 24px 50px -18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.4);opacity:0;transform:scale(.35) rotate(-14deg);animation:inPop .7s .05s cubic-bezier(.34,1.56,.64,1) forwards}
#intro .tile svg{width:78px;height:78px;overflow:visible}
#intro .coin{transform-origin:24px 24px;transform-box:view-box;animation:inFlip .75s .32s cubic-bezier(.4,0,.2,1) both}
#intro .ar1{animation:inA1 .5s .62s cubic-bezier(.2,.8,.2,1) both}
#intro .ar2{animation:inA2 .5s .68s cubic-bezier(.2,.8,.2,1) both}
#intro .shine{position:absolute;inset:0;border-radius:32px;overflow:hidden}
#intro .shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:inShine .9s 1s ease-in-out forwards}
#intro h1{margin-top:26px;font:800 40px/1.1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.03em;display:flex;justify-content:center}
#intro h1 span{display:inline-block;opacity:0;transform:translateY(16px);animation:inUp .45s cubic-bezier(.2,.8,.2,1) forwards}
#intro h1 .d{color:#bff26f}
#intro p{margin-top:10px;font:600 15px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;color:rgba(255,255,255,.8);opacity:0;animation:inFade .5s 1.15s forwards}
@keyframes inPop{to{opacity:1;transform:none}}
@keyframes inFlip{0%{transform:scale(.2) rotateY(0);opacity:0}60%{opacity:1}100%{transform:scale(1) rotateY(360deg);opacity:1}}
@keyframes inA1{from{transform:translate(-9px,-9px);opacity:0}to{transform:none;opacity:1}}
@keyframes inA2{from{transform:translate(9px,9px);opacity:0}to{transform:none;opacity:1}}
@keyframes inShine{to{left:130%}}
@keyframes inUp{to{opacity:1;transform:none}}
@keyframes inFade{to{opacity:1}}
@keyframes inRing{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

async function hashPw(pw,salt){const txt=salt+'|'+pw+'|oldi-berdi';try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=2166136261;for(let i=0;i<txt.length;i++){h^=txt.charCodeAt(i);h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16)}}
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function compressImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{let max=760,q=.74,url='';for(let i=0;i<6;i++){const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',q);if(url.length<160000)break;max=Math.round(max*.8);q=Math.max(.45,q-.08)}res(url)};img.onerror=()=>rej(new Error('img'));img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
const CONTACTS_OK=!!(navigator.contacts&&navigator.contacts.select);
async function pickContacts(multiple){try{const r=await navigator.contacts.select(['name','tel'],{multiple:!!multiple});return (r||[]).map(c=>({name:((c.name||[])[0]||'').trim(),phone:normPhone((c.tel||[])[0]||'')})).filter(c=>c.name||c.phone)}catch(e){toast("Kontaktlarni ochib bo'lmadi. Ismni qo'lda yozing.");return[]}}

function baseAmt(t){return (+t.amount||0)*(isUSD(t)&&usdOn()?rate():1)}
function curOf(t){return isUSD(t)?'$':cur()}
function amtTxt(t){return isUSD(t)?'$'+fmt(t.amount):fmt(t.amount)+' '+cur()}
function compute(){
 const bal={},usd={};for(const id in S.people){bal[id]=0;usd[id]=0}
 for(const t of Object.values(S.tx)){if(!(t.pid in bal))continue;const sg=T[t.type]?.sign||0;bal[t.pid]+=sg*baseAmt(t);if(isUSD(t))usd[t.pid]+=sg*(+t.amount||0)}
 for(const k in bal){bal[k]=Math.round(bal[k]*100)/100;usd[k]=Math.round(usd[k]*100)/100}
 S.bal=bal;S.usd=usd;allocate();
}
/* repayments are applied to the oldest loan first; this gives each loan (and each installment) a paid date */
function allocate(){
 const alloc={},trust={},byP={},td=today();
 for(const t of Object.values(S.tx))(byP[t.pid]=byP[t.pid]||[]).push(t);
 const ord=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0);
 for(const pid in byP){
  const list=byP[pid].slice().sort(ord);
  for(const [lt,rt] of [['lend','got'],['borrow','paid']]){
   const loans=list.filter(t=>t.type===lt).map(t=>{const f=isUSD(t)&&usdOn()?rate():1;let c=0;const inst=(Array.isArray(t.plan)?t.plan:[]).filter(x=>x&&x.d&&+x.a>0).map(x=>{c+=x.a*f;return {d:x.d,a:+x.a,cum:c,paidDate:null}});const total=baseAmt(t);return {id:t.id,t,total,left:total,paid:0,paidDate:null,inst}});
   let li=0;
   for(const r of list.filter(t=>t.type===rt)){let amt=baseAmt(r);
    while(amt>0.001&&li<loans.length){const L=loans[li];const take=Math.min(amt,L.left);L.left-=take;L.paid+=take;amt-=take;
     L.inst.forEach(i=>{if(!i.paidDate&&L.paid>=i.cum-0.5)i.paidDate=r.date});
     if(L.left<=0.5){L.left=0;L.paidDate=r.date;li++}}}
   loans.forEach(L=>{alloc[L.id]=L});
   if(lt==='lend'){let ok=0,n=0;
    loans.forEach(L=>{
     if(L.inst.length)L.inst.forEach(i=>{if(i.paidDate){n++;if(i.paidDate<=i.d)ok++}else if(i.d<td)n++});
     else if(L.t.due){if(L.paidDate){n++;if(L.paidDate<=L.t.due)ok++}else if(L.t.due<td)n++}
     else if(L.paidDate){n++;ok++}});
    if(n)trust[pid]={score:Math.round(ok/n*100),n}}
  }
 }
 S.alloc=alloc;S.trust=trust;
}
function nextInst(L){return L&&L.inst.find(i=>!i.paidDate)}
function overdueOf(pid){const b=S.bal[pid]||0;if(!b)return null;const want=b>0?'lend':'borrow';const td=today();let hit=null;
 for(const x of Object.values(S.tx)){if(x.pid!==pid||x.type!==want)continue;const L=S.alloc[x.id];if(L&&L.left<=0.5)continue;
  const d=L&&L.inst.length?(nextInst(L)||{}).d:x.due;
  if(d&&d<td&&(!hit||d<hit))hit=d}
 return hit}
function trustBadge(pid,big){const r=S.trust[pid];if(!r||locked('trust'))return '';const c=r.score>=85?'good':r.score>=60?'mid':'bad';const l=r.score>=85?'Ishonchli':r.score>=60?"O'rtacha":'Kechiktiradi';return `<span class="trust ${c}" title="O'z vaqtida qaytarish: ${r.score}%">${big?l+' · ':''}${r.score}%</span>`}
function addMonths(ds,k){const [y,m,d]=ds.split('-').map(Number);const last=new Date(y,m-1+k+1,0).getDate();const x=new Date(y,m-1+k,Math.min(d,last));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function planHtml(L,compact){if(!L||!L.inst.length)return '';const td=today();const usd=isUSD(L.t);
 const rows=L.inst.map((i,k)=>{const st=i.paidDate?`<span class="st ok">To'landi</span>`:i.d<td?`<span class="st late">Kechikkan</span>`:`<span class="st wait">Kutilmoqda</span>`;return `<div class="plan-row"><span>${k+1}. ${fdate(i.d)}</span><span class="num"><b>${usd?'$'+fmt(i.a):fmt(i.a)}</b> ${st}</span></div>`}).join('');
 const pct=L.total?Math.round(L.paid/L.total*100):0;
 return `<div class="plan-box"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:14px"><span>${I.cal.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px;margin-right:4px"')}To'lov grafigi</span><span class="num">${pct}%</span></div><div class="prog"><i style="width:${pct}%"></i></div><div class="hint">To'langan: <b class="num">${money(L.paid)}</b> · Qoldi: <b class="num">${money(L.left)}</b></div><div class="plan-list">${rows}</div></div>`}
function txSorted(list){return list.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0))}

function startSession(a,restore,data){
 S.acc=null;setAcc(a);
 S.locked=!!(restore&&a.pinHash)&&!aliveRecently();S.setup=a.pinHash||LS.get('oldiberdi_nopin_'+a.id)==='1'?null:{step:'pin1',mode:'new'};S.pinBuf='';S.pinErr='';S.pinTries=0;
 clearInterval(S.poll);S.people={};S.tx={};S.lists={};S.docs={};S.kids={};S.loaded={p:false,t:false};S.view='home';S.stale=false;
 if(data)applySync(data);else{try{const c=JSON.parse(LS.get('oldiberdi_cache')||'null');if(c&&c.acc&&c.acc.id===a.id)applySync(c,true)}catch(e){}}
 if(!data)sync();
 checkVersion();
 S.poll=setInterval(()=>{if(!document.hidden){sync();checkVersion()}},30000);
 render();
 const seen=+(LS.get('oldiberdi_seen_ver')||0);
 if(!seen)LS.set('oldiberdi_seen_ver',String(APP_VERSION));else if(seen<APP_VERSION)S.showNew=true;

}
function applySync(j,fromCache){
 S.people={};(j.people||[]).forEach(p=>S.people[p.id]=p);
 S.tx={};(j.tx||[]).forEach(t=>S.tx[t.id]=t);
 if(j.confirms)S.confirms=j.confirms;
 if(j.marks)S.marks=j.marks;
 if(Array.isArray(j.kids)){S.kids={};j.kids.forEach(k=>{S.kids[k.id]=k})}
 if(fromCache){if(Array.isArray(j.lists)){S.lists={};j.lists.forEach(l=>{S.lists[l.id]=l})}if(Array.isArray(j.docs)){S.docs={};j.docs.forEach(d=>{S.docs[d.id]=d})}}else{if(Array.isArray(j.lists))mergeLists(j.lists);if(Array.isArray(j.docs))mergeDocs(j.docs)}
 if(!fromCache){S.api=j.api||1;LS.set('oldiberdi_api',String(S.api))}
 if(j.rate&&j.rate.usd){S.rate=j.rate;LS.set('oldiberdi_rate',JSON.stringify(j.rate))}
 if(j.acc&&!fromCache)setAcc(j.acc);
 if(j.prices){S.prices=j.prices;LS.set('oldiberdi_prices',JSON.stringify(j.prices))}
 if(j.feat&&typeof j.feat==='object'){S.feat=j.feat;LS.set('oldiberdi_feat',JSON.stringify(j.feat))}
 S.loaded={p:true,t:true};compute();
 if(!fromCache){S.stale=false;saveCache()}
}

const BIO={ok:false};
async function bioCheck(){try{if(window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)BIO.ok=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()}catch(e){BIO.ok=false}}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
function bioGet(){try{const v=JSON.parse(LS.get('oldiberdi_bio')||'null');return v&&S.acc&&v.acc===S.acc.id?v:null}catch(e){return null}}
async function bioEnable(){try{const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Oldi-Berdi'},user:{id:new TextEncoder().encode(S.acc.id.slice(0,64)),name:S.acc.phone,displayName:S.acc.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});if(!cred)throw new Error('none');if(!LS.set('oldiberdi_bio',JSON.stringify({acc:S.acc.id,cred:b64(cred.rawId)})))throw new Error('storage');return true}catch(e){toast(e&&e.name==='NotAllowedError'?"Barmoq izi yoqilmadi. PIN kod bilan kirasiz.":"Bu qurilmada barmoq izini yoqib bo'lmadi. PIN kod bilan kirasiz.");return false}}
async function bioVerify(){const b=bioGet();if(!b)return false;try{const r=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(b.cred),transports:['internal']}],userVerification:'required',timeout:60000}});return !!r}catch(e){return false}}

function renderSetup(){const st=S.setup;

 const t={cur:['Hozirgi PIN kod',st.mode==='off'?"Qulfni o'chirish uchun hozirgi PIN kodingizni kiriting":'Avval hozirgi PIN kodingizni kiriting'],pin1:[st.mode==='new'?"PIN kod o'rnating":'Yangi PIN kod',"Ilovaga begonalar kirmasligi uchun 4 xonali kod o'ylab toping"],pin2:['PIN kodni takrorlang','Tasdiqlash uchun yana bir marta kiriting']}[st.step];
 $('#app').innerHTML=`<div class="lock"><div class="lock-top pad"><div class="lock-ic">${I.shield}</div><h2>${t[0]}</h2><p>${t[1]}</p>${pinDots()}</div>${pinPad(false)}<div class="lock-foot">${st.mode==='new'?`<button class="btn lime pin-skip" data-act="pinSkip">PIN'siz davom etish</button><div style="font-size:12.5px;opacity:.8;margin-top:8px">Qulf ixtiyoriy — keyin Profildan yoqsa bo'ladi</div>`:'<button data-act="pinCancel">Bekor qilish</button>'}</div></div>`}
async function pinDone(){const pin=S.pinBuf;
 if(S.locked){if(await hashPw(pin,S.acc.pinSalt)===S.acc.pinHash){S.locked=false;markAlive();S.pinBuf='';S.pinTries=0;render();maybeNew();maybeRemindPrompt();openRemindParam()}else{S.pinTries=(S.pinTries||0)+1;S.pinBuf='';if(S.pinTries>=5){logout();toast("5 marta xato kiritildi. Raqam va parol bilan kiring.");return}S.pinErr=`PIN noto'g'ri. Yana ${5-S.pinTries} ta urinish qoldi`;render()}return}
 const st=S.setup;if(!st)return;
 if(st.step==='cur'){if(await hashPw(pin,S.acc.pinSalt)!==S.acc.pinHash){S.pinErr="Hozirgi PIN noto'g'ri";S.pinBuf='';render();return}
  if(st.mode==='off'){try{const j=await api('setPin',{pinSalt:'',pinHash:''});setAcc(j.acc)}catch(e){S.pinErr=writeErr(e);S.pinBuf='';render();return}
   LS.set('oldiberdi_nopin_'+S.acc.id,'1');S.setup=null;S.pinBuf='';render();toast("PIN qulf o'chirildi");return}
  st.step='pin1';S.pinBuf='';render();return}
 if(st.step==='pin1'){if(/^(\d)\1{3}$/.test(pin)||pin==='1234'||pin==='4321'){S.pinErr='Bu PIN juda oson. Boshqasini tanlang';S.pinBuf='';render();return}st.first=pin;st.step='pin2';S.pinBuf='';render();return}
 if(st.step==='pin2'){if(pin!==st.first){st.step='pin1';st.first='';S.pinErr="PIN mos kelmadi. Qaytadan o'ylab toping";S.pinBuf='';render();return}
  const salt=uid();const {id,...rest}=S.acc;const data={...rest,pinSalt:salt,pinHash:await hashPw(pin,salt)};
  try{const j=await api('setPin',{pinSalt:data.pinSalt,pinHash:data.pinHash});setAcc(j.acc)}catch(e){S.pinErr=writeErr(e);S.pinBuf='';render();return}
  S.pinBuf='';if(st.mode==='new'&&BIO.ok&&!bioGet()){st.step='bio';render();return}
  S.setup=null;render();toast(st.mode==='new'?"PIN kod o'rnatildi":'PIN kod yangilandi');maybeNew()}
}
let hiddenAt=0;
/* the session survives a page reload (pull-down, update): no PIN if the app was in use a moment ago.
   sessionStorage is cleared when the app is closed, so opening it again still asks for the PIN. */
const ALIVE_MS=60000;
function markAlive(){try{if(S.acc&&!S.locked&&!S.setup)sessionStorage.setItem('ob_alive',String(Date.now()))}catch(e){}}
function aliveRecently(){try{const t=+sessionStorage.getItem('ob_alive');return !!t&&Date.now()-t<ALIVE_MS}catch(e){return false}}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(!markAlive.t||Date.now()-markAlive.t>5000){markAlive.t=Date.now();markAlive()}},{passive:true}));
window.addEventListener('pagehide',()=>markAlive());
function clearAlive(){try{sessionStorage.removeItem('ob_alive')}catch(e){}}
/* pull down at the top of the screen: refresh the data instead of reloading the app */
const PTR={y0:null,d:0,busy:false,el:null};

const SW_TABS=['home','people','history','profile'];
const SW={on:false,x0:0,y0:0,t0:0,dx:0,lock:null,el:null};
function swOk(e){
 if(!S.acc||S.locked||S.setup||sheets.length||e.touches.length!==1||!SW_TABS.includes(S.view))return false;
 if(matchMedia('(min-width:1000px)').matches)return false;
 const x=e.touches[0].clientX;if(x<18||x>innerWidth-18)return false;          // ekran chetidagi tizim imo-ishorasiga xalal bermasin
 for(let el=e.target;el&&el!==document.body;el=el.parentElement){
  if(el.matches&&el.matches('input,textarea,select,[data-noswipe]'))return false;
  if(el.scrollWidth>el.clientWidth+4){const ox=getComputedStyle(el).overflowX;if(ox==='auto'||ox==='scroll')return false}}
 return true}
function swReset(el,anim){if(!el)return;el.style.transition=anim?'transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s':'none';el.style.transform='';el.style.opacity=''}
document.addEventListener('touchstart',e=>{SW.on=swOk(e);if(!SW.on)return;SW.x0=e.touches[0].clientX;SW.y0=e.touches[0].clientY;SW.t0=Date.now();SW.dx=0;SW.lock=null;SW.el=document.querySelector('.main')},{passive:true});
document.addEventListener('touchmove',e=>{if(!SW.on||!SW.el)return;const dx=e.touches[0].clientX-SW.x0,dy=e.touches[0].clientY-SW.y0;
 if(SW.lock===null){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;SW.lock=Math.abs(dx)>Math.abs(dy)*1.3?'x':'y';if(SW.lock==='x'){PTR.y0=null;ptrHide()}}
 if(SW.lock!=='x')return;const i=SW_TABS.indexOf(S.view);let d=dx;if((i===0&&dx>0)||(i===SW_TABS.length-1&&dx<0))d=dx*.25;
 SW.dx=dx;SW.el.style.transition='none';SW.el.style.transform=`translateX(${d*.45}px)`;SW.el.style.opacity=String(1-Math.min(Math.abs(d)/innerWidth*.7,.35))},{passive:true});
document.addEventListener('touchend',()=>{if(!SW.on)return;SW.on=false;const el=SW.el;if(SW.lock!=='x'){return}
 const i=SW_TABS.indexOf(S.view),dir=SW.dx<0?1:-1,j=i+dir,fast=Math.abs(SW.dx)/Math.max(1,Date.now()-SW.t0)>.45;
 if(j<0||j>=SW_TABS.length||!(Math.abs(SW.dx)>innerWidth*.22||(fast&&Math.abs(SW.dx)>45))){swReset(el,true);return}
 el.style.transition='transform .15s ease-in,opacity .15s';el.style.transform=`translateX(${-dir*70}px)`;el.style.opacity='0';
 try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
 setTimeout(()=>{closeAllSheets();S.view=SW_TABS[j];render();window.scrollTo(0,0);const m=document.querySelector('.main');if(!m)return;
  m.style.transition='none';m.style.transform=`translateX(${dir*70}px)`;m.style.opacity='0';void m.offsetWidth;swReset(m,true)},140)},{passive:true});

/* ============ shopping lists (Premium): paper-free market list kept on the phone and in the account ============ */
const LQ=/^(\d+(?:[.,]\d+)?)\s*(kg|kilo|g|gr|gramm|l|litr|ml|ta|dona|bog'|bog‘|pachka|qop|quti|shisha|m|metr)?\.?\s+(.+)$/i;
const LQE=/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(kg|kilo|g|gr|gramm|l|litr|ml|ta|dona|bog'|bog‘|pachka|qop|quti|shisha|m|metr)\.?$/i;
function parseItem(s){s=String(s||'').trim();const qq=(a,u)=>(a.replace('.',',')+(u?' '+u.toLowerCase():'')).slice(0,24);let m=s.match(LQ);if(m&&m[3].trim())return {n:m[3].trim().slice(0,80),q:qq(m[1],m[2])};m=s.match(LQE);if(m)return {n:m[1].trim().slice(0,80),q:qq(m[2],m[3])};return {n:s.slice(0,80),q:''}}
function normList(l){return {id:String(l.id),name:String(l.name||''),items:(Array.isArray(l.items)?l.items:[]).map(i=>({id:String(i.id||uid()),n:String(i.n||''),q:String(i.q||''),p:+i.p||0,d:i.d?1:0})),createdAt:+l.createdAt||0,updatedAt:+l.updatedAt||0}}
/* server copy wins, except lists changed here that the server has not received yet */
function mergeLists(arr){const out={},push=[];arr.forEach(l=>{const x=normList(l);out[x.id]=x});
 for(const l of Object.values(S.lists||{})){if(!l._u)continue;const sv=out[l.id];if(!sv||(l.updatedAt||0)>(sv.updatedAt||0)){out[l.id]=l;push.push(l.id)}}
 S.lists=out;if(push.length)setTimeout(()=>push.forEach(listQueue),0)}
function listOut(l){return {id:l.id,name:l.name,items:l.items.map(i=>({id:i.id,n:i.n,q:i.q||'',p:+i.p||0,d:i.d?1:0})),createdAt:l.createdAt,updatedAt:l.updatedAt}}
const LT={};
/* saves are grouped: many quick ticks in the market become one request */
function listQueue(id){if(S.api<8){const l=S.lists[id];if(l){l._u=1;saveCache()}return}
 if(LT[id])clearTimeout(LT[id]);else{S.pending=(S.pending||0)+1;showSaving()}
 LT[id]=setTimeout(()=>{delete LT[id];S.pending--;const l=S.lists[id];if(!l){showSaving();return}const item=listOut(l);
  bg("Ro'yxat saqlanmadi",async()=>{await api('saveList',{item});const x=S.lists[id];if(x&&x.updatedAt===item.updatedAt){delete x._u;saveCache()}},()=>{const x=S.lists[id];if(x){x._u=1;saveCache()}})},700)}
function listTouch(l){l.updatedAt=Date.now();l._u=1;S.lists[l.id]=l;saveCache();listQueue(l.id)}
function listStats(l){let n=l.items.length,d=0,sum=0,spent=0;l.items.forEach(i=>{const p=+i.p||0;sum+=p;if(i.d){d++;spent+=p}});return {n,d,sum,spent}}
function curList(){return S.lists[S.lid]}
function shopCard(){const ls=Object.values(S.lists||{});const open=ls.reduce((z,l)=>z+l.items.filter(i=>!i.d).length,0);
 return `<button class="shop-card" data-act="go" data-v="lists"><span class="qi">${I.cart}</span><span class="mid"><b>Bozorlik ro'yxati ${lk('shop')}</b><small>${locked('shop')?"Qog'ozsiz bozorlik — ro'yxat telefoningizda":ls.length?`${ls.length} ta ro'yxat · ${open} ta olinmagan`:"Ro'yxat tuzing — qog'oz kerak emas"}</small></span><span class="go">${I.right}</span></button>`}
function vLists(){const back=`<button class="icon-btn" data-act="go" data-v="home" aria-label="Orqaga">${I.left}</button>`;
 if(locked('shop'))return `<div class="pad"><div class="topbar">${back}<h1>Bozorlik ro'yxati</h1></div>
 <div class="card shop-promo"><div class="sp-ic">${I.cart}</div><h2>Qog'oz ro'yxat endi kerak emas</h2><p>Bozorga nima olish kerakligini telefoningizga yozing. Olganingizni belgilab borasiz — hech narsa esdan chiqmaydi, qancha pul ketganini ilova o'zi hisoblaydi.</p>
 <ul class="prem-list">${[["Bir nechta ro'yxat","Haftalik bozor, uy uchun, to'y uchun…"],["Belgilab borish","Olinganlar alohida, qolgani bir qarashda"],["Xarajat hisobi","Narx yozsangiz — jami va sarflangan summa"],["Oilaga ulashish","Ro'yxatni Telegram yoki SMS orqali yuborish"],["Har hafta qayta ishlatish","Bir bosishda ro'yxat yana yangidek"]].map(([a,b])=>`<li><span class="pi">${I.check}</span><span><b>${a}</b><small>${b}</small></span></li>`).join('')}</ul>
 <button class="btn btn-primary" style="width:100%" data-act="prem" data-v="shop">★ Premium bilan ochish</button></div></div>`;
 const ls=Object.values(S.lists).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
 return `<div class="pad"><div class="topbar">${back}<h1>Bozorlik ro'yxati</h1><button class="icon-btn" data-act="listNew" aria-label="Yangi ro'yxat">${I.plus}</button></div>
 ${ls.length?`<div class="card list">${ls.map(l=>{const s=listStats(l);const pct=s.n?Math.round(s.d/s.n*100):0;return `<button class="item" data-act="listOpen" data-id="${l.id}"><span class="sl-ic">${I.cart}</span><div class="mid"><div class="t1" data-notr>${esc(l.name)}</div><div class="t2">${s.n?`${s.d}/${s.n} olindi`:"Bo'sh ro'yxat"}${s.sum?` · <span class="num">${money(s.sum)}</span>`:''}</div><div class="sl-bar"><i style="width:${pct}%"></i></div></div><span class="r" style="color:var(--muted);display:inline-flex">${I.right}</span></button>`}).join('')}</div>`
 :`<div class="card empty"><div class="ei">${I.cart}</div><b>Hali ro'yxat yo'q</b>Bozorga chiqishdan oldin nima olishni yozing — qog'oz kerak emas.<div><button class="btn btn-primary btn-sm" style="margin-top:12px" data-act="listNew">${I.plus} Yangi ro'yxat</button></div></div>`}
 <p class="hint" style="margin-top:12px">${S.api>=8?"Ro'yxatlar akkauntingizda saqlanadi — istalgan telefondan ko'rasiz.":"Ro'yxatlar hozircha shu telefonda saqlanmoqda."}</p>
 </div>`}
function itemRow(i){return `<div class="sl-row${i.d?' done':''}"><button class="sl-chk" data-act="itemTog" data-id="${i.id}" aria-label="${i.d?'Olinmadi deb belgilash':'Olindi deb belgilash'}" aria-pressed="${i.d?'true':'false'}">${i.d?I.check:''}</button><button class="sl-main" data-act="itemEdit" data-id="${i.id}"><span class="sl-n" data-notr>${esc(i.n)}</span>${i.q?`<span class="sl-q" data-notr>${esc(i.q)}</span>`:''}</button>${+i.p?`<span class="sl-p num">${fmt(i.p)}</span>`:''}</div>`}
function vList(){const l=curList();if(!l||locked('shop')){S.view='lists';return vLists()}
 const s=listStats(l);const todo=l.items.filter(i=>!i.d),done=l.items.filter(i=>i.d);
 return `<div class="pad"><div class="topbar"><button class="icon-btn" data-act="go" data-v="lists" aria-label="Orqaga">${I.left}</button><h1 data-notr>${esc(l.name)}</h1><button class="icon-btn" data-act="listShare" aria-label="Ulashish">${I.send}</button><button class="icon-btn" data-act="listMenu" aria-label="Ro'yxat sozlamalari">${I.edit}</button></div>
 <form class="sl-add card" data-form="item" autocomplete="off"><input class="inp" id="it-n" name="n" maxlength="100" placeholder="2 kg kartoshka" aria-label="Mahsulot" enterkeyhint="done"><input class="inp num" id="it-p" name="p" data-amount inputmode="decimal" placeholder="Narxi" aria-label="Narxi (ixtiyoriy)"><button class="btn btn-primary" aria-label="Qo'shish">${I.plus}</button></form>
 <div class="sl-sum card"><div><span>Jami</span><b class="num">${fmt(s.sum)}</b></div><div><span>Sarflandi</span><b class="num">${fmt(s.spent)}</b></div><div><span>Olinmagan</span><b class="num">${s.n-s.d} ta</b></div></div>
 ${l.items.length?'':`<div class="card empty" style="margin-top:10px"><b>Ro'yxat bo'sh</b>Yuqoriga mahsulot nomini yozing. Miqdor va narx ixtiyoriy.</div>`}
 ${todo.length?`<div class="sec-head"><h2>Olinadi</h2><span class="hint">${todo.length} ta</span></div><div class="card">${todo.map(itemRow).join('')}</div>`:(l.items.length?`<div class="card empty" style="margin-top:10px"><b>✓ Hammasi olindi!</b></div>`:'')}
 ${done.length?`<div class="sec-head"><h2>Olingan</h2><span class="sec-links"><button class="link" data-act="listReset">Qayta boshlash</button><button class="link" data-act="listClear">Tozalash</button></span></div><div class="card">${done.map(itemRow).join('')}</div>`:''}
 </div>`}
function addItem(f){const l=curList();if(!l||!need('shop'))return;const raw=f.n.value.trim();if(!raw){f.n.focus();return}
 if(l.items.length>=150){toast("Bitta ro'yxatda ko'pi bilan 150 ta mahsulot bo'ladi");return}
 const it=parseItem(raw);l.items.push({id:uid(),n:it.n,q:it.q,p:Math.max(0,parseAmt(f.p.value)),d:0});listTouch(l);render._focus='it-n';render()}
function listNewSheet(){openSheet("Yangi ro'yxat",`<form data-form="listNew" autocomplete="off"><div class="field"><label for="ln-name">Ro'yxat nomi</label><input class="inp" id="ln-name" name="name" maxlength="60" value="Bozorlik · ${esc(fdate(today()))}"></div><button class="btn btn-primary" style="width:100%">Yaratish</button></form>`,'listnew');setTimeout(()=>{const i=$('#ln-name');if(i){i.focus();i.select()}},300)}
function saveListNew(f){if(!need('shop'))return;if(Object.keys(S.lists).length>=30){toast("Ko'pi bilan 30 ta ro'yxat bo'ladi");return}
 const now=Date.now();const l={id:uid(),name:f.name.value.trim().slice(0,60)||'Bozorlik',items:[],createdAt:now,updatedAt:now};
 listTouch(l);closeAllSheets();S.lid=l.id;S.view='list';render();setTimeout(()=>{const i=$('#it-n');i&&i.focus()},200)}
function itemSheet(id){const l=curList();const i=l&&l.items.find(x=>x.id===id);if(!i)return;
 openSheet('Mahsulot',`<form data-form="itemEdit" data-id="${i.id}" autocomplete="off"><div class="field"><label for="ie-n">Nomi</label><input class="inp" id="ie-n" name="n" maxlength="80" value="${esc(i.n)}"></div>
 <div style="display:flex;gap:10px"><div class="field" style="flex:1"><label for="ie-q">Miqdori</label><input class="inp" id="ie-q" name="q" maxlength="24" placeholder="2 kg" value="${esc(i.q)}"></div><div class="field" style="flex:1"><label for="ie-p">Narxi</label><input class="inp num" id="ie-p" name="p" data-amount inputmode="decimal" placeholder="0" value="${+i.p?fmt(i.p):''}"></div></div>
 <button class="btn btn-primary" style="width:100%">Saqlash</button></form>
 <button class="btn btn-danger btn-sm" style="margin-top:14px" data-act="itemDel" data-id="${i.id}">${I.trash} O'chirish</button>`,'item')}
function saveItemEdit(f){const l=curList();const i=l&&l.items.find(x=>x.id===f.dataset.id);if(!i)return;const n=f.n.value.trim();if(!n){f.n.focus();return}
 i.n=n.slice(0,80);i.q=f.q.value.trim().slice(0,24);i.p=Math.max(0,parseAmt(f.p.value));listTouch(l);closeAllSheets();render()}
function listText(l){const s=listStats(l);const line=i=>`${i.d?'✅':'⬜'} ${i.n}${i.q?' — '+i.q:''}${+i.p?' · '+fmt(i.p):''}`;
 return `🛒 ${l.name}\n\n${l.items.filter(i=>!i.d).map(line).join('\n')}${l.items.some(i=>i.d)?'\n'+l.items.filter(i=>i.d).map(line).join('\n'):''}${s.sum?`\n\nJami: ${money(s.sum)}`:''}\n\nOldi-Berdi ilovasida tuzilgan`}
function listShareSheet(){const l=curList();if(!l)return;if(!l.items.length){toast("Avval ro'yxatga mahsulot qo'shing");return}S.shareCtx=null;
 openSheet("Ro'yxatni ulashish",`<p class="hint" style="margin:0 0 10px">Oila a'zongizga yuboring — u ham bozorga nima olishni biladi.</p><div class="field"><textarea class="inp" id="sh-text" rows="9" data-notr>${esc(listText(l))}</textarea></div>
 <div class="copts"><button class="copt" data-act="shareVia" data-v="tg"><span class="qi" style="background:#e3f2fb;color:#1c8fca">${I.send}</span><b>Telegram</b></button>${navigator.share?`<button class="copt" data-act="shareVia" data-v="any"><span class="qi" style="background:var(--surface-2);color:var(--brand)">${I.link}</span><b>Boshqa ilova orqali</b></button>`:''}<button class="copt" data-act="shareVia" data-v="copy"><span class="qi" style="background:var(--surface-2);color:var(--brand)">${I.book}</span><b>Nusxalash</b></button></div>`,'listshare')}
function listMenuSheet(){const l=curList();if(!l)return;
 openSheet("Ro'yxat",`<form data-form="listRename" autocomplete="off"><div class="field"><label for="lr-name">Nomi</label><input class="inp" id="lr-name" name="name" maxlength="60" value="${esc(l.name)}"></div><button class="btn btn-primary" style="width:100%">Saqlash</button></form>
 <button class="btn btn-ghost" style="width:100%;margin-top:10px" data-act="listCopy">Nusxa olish (yangi ro'yxat)</button>
 <button class="btn btn-danger btn-sm" style="margin-top:14px" data-act="listDel">${I.trash} Ro'yxatni o'chirish</button>`,'listmenu')}
function saveListRename(f){const l=curList();if(!l)return;l.name=f.name.value.trim().slice(0,60)||l.name;listTouch(l);closeAllSheets();render()}
function listDelete(id){const l=S.lists[id];if(!l)return;if(LT[id]){clearTimeout(LT[id]);delete LT[id];S.pending--;showSaving()}
 delete S.lists[id];saveCache();if(S.api>=8)bg("Ro'yxat o'chirilmadi",()=>api('deleteList',{id}),()=>{S.lists[id]=l;saveCache()})}

/* ============ docs: to'yona, kreditlar, gap, pul yig'ish, biznes — one generic synced store ============ */
const DOC_FEAT={toy:'toy',toyg:'toy',loan:'loan',gap:'gap',yigin:'yigin',biz:'biz'};
function isBiz(){const p=S.acc&&S.acc.premium;return !!(p&&p.biz)}
function docLocked(kind){const f=DOC_FEAT[kind];return f==='biz'?!isBiz():f?locked(f):false}
function normDoc(d){const x=d.data;return {id:String(d.id),kind:String(d.kind||''),name:String(d.name||''),data:x&&typeof x==='object'&&!Array.isArray(x)?x:{},createdAt:+d.createdAt||0,updatedAt:+d.updatedAt||0}}
function mergeDocs(arr){const out={},push=[];arr.forEach(d=>{const x=normDoc(d);out[x.id]=x});
 for(const d of Object.values(S.docs||{})){if(!d._u)continue;const sv=out[d.id];if(!sv||(d.updatedAt||0)>(sv.updatedAt||0)){out[d.id]=d;push.push(d.id)}}
 S.docs=out;if(push.length)setTimeout(()=>push.forEach(docQueue),0)}
const DT={};
function docOut(d){return {id:d.id,kind:d.kind,name:d.name,data:d.data,createdAt:d.createdAt,updatedAt:d.updatedAt}}
function docQueue(id){if(S.api<9){const d=S.docs[id];if(d){d._u=1;saveCache()}return}
 if(DT[id])clearTimeout(DT[id]);else{S.pending=(S.pending||0)+1;showSaving()}
 DT[id]=setTimeout(()=>{delete DT[id];S.pending--;const d=S.docs[id];if(!d){showSaving();return}const item=docOut(d);
  bg('Saqlanmadi',async()=>{await api('saveDoc',{item});const x=S.docs[id];if(x&&x.updatedAt===item.updatedAt){delete x._u;saveCache()}},()=>{const x=S.docs[id];if(x){x._u=1;saveCache()}})},700)}
function docTouch(d){d.updatedAt=Date.now();d._u=1;S.docs[d.id]=d;saveCache();docQueue(d.id)}
function docDelete(id){const d=S.docs[id];if(!d)return;if(DT[id]){clearTimeout(DT[id]);delete DT[id];S.pending--;showSaving()}
 delete S.docs[id];saveCache();if(S.api>=9)bg("O'chirilmadi",()=>api('deleteDoc',{id}),()=>{S.docs[id]=d;saveCache()})}
function docsOf(k){return Object.values(S.docs||{}).filter(d=>d.kind===k)}
function newDoc(kind,name,data){const now=Date.now();return {id:uid(),kind,name,data,createdAt:now,updatedAt:now}}
function curDoc(){return S.docs[S.did]}
function sumOf(a,f){return a.reduce((z,x)=>z+(+f(x)||0),0)}
function backBtn(v){return `<button class="icon-btn" data-act="go" data-v="${v}" aria-label="Orqaga">${I.left}</button>`}
function promoView(title,icon,h,p,list,feat){return `<div class="pad"><div class="topbar">${backBtn('home')}<h1>${title}</h1></div><div class="card shop-promo"><div class="sp-ic">${icon}</div><h2>${h}</h2><p>${p}</p><ul class="prem-list">${list.map(([a,b])=>`<li><span class="pi">${I.check}</span><span><b>${a}</b><small>${b}</small></span></li>`).join('')}</ul><button class="btn btn-primary" style="width:100%" data-act="prem" data-v="${feat}">★ Premium bilan ochish</button></div></div>`}
function shareSheet(title,intro,text){S.shareCtx=null;
 openSheet(title,`<p class="hint" style="margin:0 0 10px">${intro}</p><div class="field"><textarea class="inp" id="sh-text" rows="9" data-notr>${esc(text)}</textarea></div>
 <div class="copts"><button class="copt" data-act="shareVia" data-v="tg"><span class="qi" style="background:#e3f2fb;color:#1c8fca">${I.send}</span><b>Telegram</b></button>${navigator.share?`<button class="copt" data-act="shareVia" data-v="any"><span class="qi" style="background:var(--surface-2);color:var(--brand)">${I.link}</span><b>Boshqa ilova orqali</b></button>`:''}<button class="copt" data-act="shareVia" data-v="copy"><span class="qi" style="background:var(--surface-2);color:var(--brand)">${I.book}</span><b>Nusxalash</b></button></div>`,'share')}
function nameList(){const s=new Set();Object.values(S.people).forEach(p=>s.add(p.name));docsOf('toy').forEach(e=>(e.data.items||[]).forEach(i=>s.add(i.n)));const g=gdoc();if(g)(g.data.items||[]).forEach(i=>s.add(i.n));docsOf('gap').concat(docsOf('yigin')).forEach(d=>(d.data.members||[]).forEach(m=>s.add(m.n)));
 return `<datalist id="nm-list">${[...s].filter(Boolean).slice(0,600).map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`}

/* home: services grid */
function toolsGrid(){const ls=Object.values(S.lists||{});const open=ls.reduce((z,l)=>z+l.items.filter(i=>!i.d).length,0);
 const gOn=fon('gap'),yOn=fon('yigin');

/* ---------- loans & installments calendar ---------- */
function lnDue(d,ym){const [y,m]=ym.split('-').map(Number);const last=new Date(y,m,0).getDate();return ym+'-'+String(Math.min(Math.max(1,+d.data.day||1),last)).padStart(2,'0')}
function lnMonths(d){const n=Math.max(1,Math.min(120,+d.data.n||1)),st=/^\d{4}-\d{2}$/.test(d.data.start||'')?d.data.start:today().slice(0,7),out=[];for(let i=0;i<n;i++)out.push(ymShift(st,i));return out}
function lnInfo(d){const ms=lnMonths(d),paid=new Set(d.data.paid||[]),amt=+d.data.amt||0,td=today(),unpaid=ms.filter(m=>!paid.has(m)),next=unpaid[0]||null;
 return {ms,paid,amt,done:ms.length-unpaid.length,left:unpaid.length*amt,next,nextDate:next?lnDue(d,next):null,late:unpaid.filter(m=>lnDue(d,m)<td).length}}
function daysTo(ds){return Math.round((new Date(ds+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5)}
function dueLabel(ds){const n=daysTo(ds);return n<0?`${-n} kun kechikdi`:n===0?'bugun':n===1?'ertaga':`${n} kundan keyin`}
function loanAlerts(){if(!fon('loan')||locked('loan'))return [];return docsOf('loan').map(d=>({d,i:lnInfo(d)})).filter(x=>x.i.next&&daysTo(x.i.nextDate)<=3).sort((a,b)=>a.i.nextDate.localeCompare(b.i.nextDate))}
function loanCard(){const l=loanAlerts();if(!l.length)return '';
 return `<button class="rem-card" data-act="go" data-v="loans"><span class="qi">${I.bank}</span><span class="mid"><b>Kredit to'lovi yaqin · ${l.length} ta</b><small>${l.slice(0,2).map(x=>`<span data-notr>${esc(x.d.name)}</span> — ${fmt(x.i.amt)} · ${dueLabel(x.i.nextDate)}`).join(', ')}</small></span><span class="go">${I.left}</span></button>`}

function ymShift(ym,k){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function ymName(ym,short){const [y,m]=ym.split('-').map(Number);const n=isRu()?RU_MON_N[m-1]:MON[m-1];const cap=n.charAt(0).toUpperCase()+n.slice(1);return short?cap.slice(0,3):cap+' '+y}
function monthStats(ym){const r={lend:0,got:0,borrow:0,paid:0,n:0,per:{}};
 for(const t of Object.values(S.tx)){if(!(t.date||'').startsWith(ym))continue;const a=baseAmt(t);r[t.type]=(r[t.type]||0)+a;r.n++;const q=r.per[t.pid]||(r.per[t.pid]={lend:0,got:0,borrow:0,paid:0,n:0});q[t.type]+=a;q.n++}
 return r}
function shortNum(n){n=Math.abs(n);return n>=1e9?(Math.round(n/1e8)/10)+(isRu()?' млрд':' mlrd'):n>=1e6?(Math.round(n/1e5)/10)+(isRu()?' млн':' mln'):n>=1e3?Math.round(n/1e3)+(isRu()?' тыс':' ming'):String(Math.round(n))}
function barChart(ym){const ms=[];for(let k=5;k>=0;k--){const m=ymShift(ym,-k);const st=monthStats(m);ms.push({m,a:st.lend,b:st.got})}
 const max=Math.max(1,...ms.map(x=>Math.max(x.a,x.b)));const W=320,H=150,top=16,bot=24,gw=W/6,bw=16;
 let g='';ms.forEach((x,i)=>{const cx=gw*i+gw/2;const h1=(H-top-bot)*x.a/max,h2=(H-top-bot)*x.b/max;const on=x.m===ym;
  g+=`<g class="${on?'on':''}"><rect x="${cx-bw-1}" y="${H-bot-h1}" width="${bw}" height="${Math.max(h1,x.a?2:0)}" rx="3" class="b1"/><rect x="${cx+1}" y="${H-bot-h2}" width="${bw}" height="${Math.max(h2,x.b?2:0)}" rx="3" class="b2"/><text x="${cx}" y="${H-7}" text-anchor="middle" class="lb">${ymName(x.m,true)}</text>${x.a?`<text x="${cx-bw/2-1}" y="${H-bot-h1-4}" text-anchor="middle" class="vl">${shortNum(x.a)}</text>`:''}</g>`});
 return `<svg class="rchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tr('Oxirgi 6 oy')}" data-notr><line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" class="ax"/>${g}</svg><div class="rleg"><span><i class="b1"></i>Berilgan</span><span><i class="b2"></i>Qaytgan</span></div>`}

function loadXlsx(){if(window.XLSX)return Promise.resolve(window.XLSX);if(XLSXP)return XLSXP;XLSXP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>res(window.XLSX);sc.onerror=()=>{XLSXP=null;rej(new Error('xlsx'))};document.head.appendChild(sc)});return XLSXP}

const sheets=[];

function closeSheet(){const w=sheets.pop();if(w)w.remove();if(!sheets.length)document.body.style.overflow=''}

/* --- reminder suggestions: overdue, due today/tomorrow, and debts with no deadline every N days --- */
function remDays(){return +(LS.get('oldiberdi_remdays')||7)}
function lastRemind(p){let t=0;(p.log||[]).forEach(l=>{if(/^Eslatma/.test(l.t)&&l.at>t)t=l.at});return t}
function addDays(ds,k){const [y,m,d]=ds.split('-').map(Number);const x=new Date(y,m-1,d+k);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function remindList(){const td=today(),tm=addDays(td,1),out=[];const now=Date.now();
 for(const p of Object.values(S.people)){const b=S.bal[p.id]||0;if(b<=0)continue;if(+(LS.get('oldiberdi_snooze_'+p.id)||0)>now)continue;
  const last=lastRemind(p);const since=last?(now-last)/864e5:1e9;
  let near=null,lastLoan=null;
  for(const x of Object.values(S.tx)){if(x.pid!==p.id||x.type!=='lend')continue;if(!lastLoan||x.date>lastLoan)lastLoan=x.date;const L=S.alloc[x.id];if(L&&L.left<=0.5)continue;const d=L&&L.inst.length?(nextInst(L)||{}).d:x.due;if(d&&d>=td&&(!near||d<near))near=d}
  const od=overdueOf(p.id);
  if(od){if(since>=2)out.push({p,why:'od',rank:0,label:`Muddati ${fdate(od)} da o'tgan`});continue}
  if(near&&near<=tm){if(since>=1)out.push({p,why:'soon',rank:1,label:near===td?'Muddati bugun':'Muddati ertaga'});continue}
  if(!near){const age=lastLoan?Math.floor((new Date(td)-new Date(lastLoan))/864e5):0;if(age>=remDays()&&since>=remDays())out.push({p,why:'nodue',rank:2,label:`Muddat kiritilmagan · ${age} kundan beri`})}
 }
 return out.sort((a,b)=>a.rank-b.rank||(S.bal[b.p.id]||0)-(S.bal[a.p.id]||0))}

function remindText(p){if(isRu())return remindTextRu(p);const b=S.bal[p.id]||0;const od=overdueOf(p.id);let next=null,due=null;
 for(const x of Object.values(S.tx)){if(x.pid!==p.id||x.type!=='lend')continue;const L=S.alloc[x.id];if(!L||L.left<=0.5)continue;const i=nextInst(L);if(i&&(!next||i.d<next.d))next={d:i.d,a:L.t.cur==='USD'?'$'+fmt(i.a):fmt(i.a)+' '+cur()};if(!L.inst.length&&x.due&&(!due||x.due<due))due=x.due}

 if(next)s+=next.d<today()?`\n${fdate(next.d)} kuni ${next.a} to'lashingiz kerak edi.`:`\nKeyingi to'lov: ${fdate(next.d)} — ${next.a}.`;else if(od)s+=`\nQaytarish muddati ${fdate(od)} edi.`;else if(due)s+=`\nQaytarish muddati: ${fdate(due)}.`;
 return s+`\n\nRahmat!\n${signName()}`}

 for(const x of Object.values(S.tx)){if(x.pid!==p.id||x.type!=='lend')continue;const L=S.alloc[x.id];if(!L||L.left<=0.5)continue;const i=nextInst(L);if(i&&(!next||i.d<next.d))next={d:i.d,a:L.t.cur==='USD'?'$'+fmt(i.a):R(fmt(i.a)+' '+cur())};if(!L.inst.length&&x.due&&(!due||x.due<due))due=x.due}

/* --- quick entry: "Akmalga 500 ming berdim" (typed or spoken) --- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const NUMW={bir:1,ikki:2,uch:3,"to'rt":4,tort:4,besh:5,olti:6,yetti:7,sakkiz:8,"to'qqiz":9,toqqiz:9,"o'n":10,yigirma:20,"o'ttiz":30,ottiz:30,qirq:40,ellik:50,oltmish:60,yetmish:70,sakson:80,"to'qson":90,toqson:90};
function parseNum(s){
 s=s.replace(/(\d)[\s.](?=\d{3}(?!\d))/g,'$1').replace(/(\d)[\s.](?=\d{3}(?!\d))/g,'$1').replace(/(\d),(\d)/g,'$1.$2');
 let total=0,curv=0,half=false,found=false;
 for(let w of s.split(/[\s,;]+/)){w=w.replace(/[^0-9a-z'.$\u0430-\u044f\u0451]/g,'').replace(/^\$/,'');if(!w)continue;
  const m=w.match(/^(\d+(?:\.\d+)?)(k|ming|mln|million|к|т|тыс|млн)?$/);
  if(m){curv+=parseFloat(m[1]);found=true;if(m[2]){total+=curv*(/^(k|ming|к|т|тыс)$/.test(m[2])?1e3:1e6);curv=0}continue}
  if(w==='yarim'){half=true;found=true;continue}
  if(NUMW[w]!=null){curv+=NUMW[w];found=true;continue}
  if(w==='yuz'){curv=(curv||1)*100;found=true;continue}
  const mul=/^(ming|тыс)/.test(w)?1e3:/^(million|mln|millon|млн|миллион)/.test(w)?1e6:/^(milliard|mlrd|млрд|миллиард)/.test(w)?1e9:0;
  if(mul){total+=((curv||0)+(half?0.5:0)||1)*mul;curv=0;half=false;found=true;continue}
 }
 total+=curv+(half&&!curv?0:0);return found?Math.round(total*100)/100:0}
function normName(x){return String(x||'').toLowerCase().replace(/[’‘`ʻʼ']/g,'').replace(/\s+/g,' ').trim()}
function parseQuick(raw){
 const low=' '+raw.toLowerCase().replace(/[’‘`ʻʼ]/g,"'")+' ';
 let type='lend';
 if(/qaytardim|to'ladim|uzdim|я вернул|я отдал|вернула? ему|вернула? ей|отдала? долг/.test(low))type='paid';else if(/qaytardi|to'ladi|uzdi|вернула?|вернули|отдала?/.test(low))type='got';else if(/\boldim\b|qarz oldim|qarzga oldim|olgandim|взяла?|заняла?|одолжила? у/.test(low))type='borrow';
 const usd=/dollar|\$|usd|долл/.test(low);
 const amount=parseNum(low.split(/muddat/)[0]);
 const txt=normName(raw),words=txt.split(' ');let best=null;
 for(const p of Object.values(S.people)){const pn=normName(p.name);const first=pn.split(' ')[0];if(first.length<2)continue;
  if(txt.includes(pn)){if(!best||pn.length>best.len)best={p,len:pn.length}}
  else if(words.some(w=>w.startsWith(first)&&w.length-first.length<=5)){if(!best||first.length>best.len)best={p,len:first.length}}}
 let name='';
 if(!best){const stop=/^(qarz|qarzga|ming|million|mln|yuz|dollar|berdim|oldim|qaytardi|qaytardim|bugun|kecha|som|so'm|sum|ga|dan|va|uchun|я|дал|дала|взял|взяла|вернул|вернула|вернули|в|долг|тысяч|тысячи|тыс|млн|сум|сегодня|вчера|у|мне|ему|ей|занял|заняла|одолжил|долларов)$/i;
  const w=raw.trim().split(/\s+/).find(x=>/^[^\d\s$]{2,}/.test(x)&&!stop.test(x.replace(/[,.!?]/g,''))&&!NUMW[x.toLowerCase()]);
  if(w){name=w.replace(/[,.!?]/g,'').replace(/(ga|ka|qa|dan|ning|ni|da)$/i,'');if(/[\u0400-\u04ff]/.test(name)&&name.length>4)name=name.replace(/(ю|у)$/i,'');name=name.charAt(0).toUpperCase()+name.slice(1)}}
 return {type,amount,cur:usd&&usdOn()&&!locked('usd')?'USD':'',pid:best?best.p.id:null,name}}
function doQuick(){const inp=$('#qk');const raw=(inp&&inp.value||'').trim();if(!raw){toast("Masalan: «Akmalga 500 ming berdim»");return}
 const r=parseQuick(raw);txForm({type:r.type,pid:r.pid,amount:r.amount||'',cur:r.cur,q:r.pid?'':r.name});inp.value=''}

/* --- voice: hold the mic, speak, release. The server (Gemini) turns the recording into Uzbek text --- */
const QK_PH="Tez yozish: «Akmalga 500 ming berdim»";
const VR={on:false};
async function voiceStart(btn){
 if(VR.on)return;const inp=$('#qk');if(!inp)return;
 if(S.api<3)return A.mic({},btn);
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){toast("Bu telefonda mikrofon ishlamaydi");return}
 Object.assign(VR,{on:true,btn,chunks:[],t0:Date.now(),released:false,ctx:null});btn.classList.add('on');inp.value='';inp.placeholder="Gapiring… tugmani qo'yib yuboring";
 try{VR.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}})}
 catch(e){voiceReset();toast("Mikrofonga ruxsat bering: telefon so'raganda «Ruxsat berish» ni bosing");return}
 if(VR.released){voiceReset();toast("Tugmani ushlab turib gapiring, keyin qo'yib yuboring");return}
 const AC=window.AudioContext||window.webkitAudioContext;VR.ctx=new AC();VR.rate=VR.ctx.sampleRate;VR.t0=Date.now();
 VR.src=VR.ctx.createMediaStreamSource(VR.stream);VR.proc=VR.ctx.createScriptProcessor(4096,1,1);
 VR.proc.onaudioprocess=e=>{if(VR.on)VR.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
 VR.src.connect(VR.proc);VR.proc.connect(VR.ctx.destination);
 VR.timer=setTimeout(()=>voiceStop(),15000)}
function voiceReset(){VR.on=false;clearTimeout(VR.timer);try{VR.proc&&VR.proc.disconnect();VR.src&&VR.src.disconnect()}catch(e){}try{VR.stream&&VR.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{VR.ctx&&VR.ctx.close()}catch(e){}
 VR.proc=VR.src=VR.stream=VR.ctx=null;if(VR.btn)VR.btn.classList.remove('on');const inp=$('#qk');if(inp)inp.placeholder=QK_PH}
async function voiceStop(){
 if(!VR.on)return;VR.released=true;if(!VR.ctx)return;
 const chunks=VR.chunks,rate=VR.rate,dur=(Date.now()-VR.t0)/1000;voiceReset();
 if(dur<0.7||!chunks.length){toast("Tugmani ushlab turib gapiring, keyin qo'yib yuboring");return}
 const inp=$('#qk'),btn=$('.qk-mic');if(inp)inp.placeholder='Tanilmoqda…';btn&&btn.classList.add('busy');
 try{const j=await api('voice',{audio:await blobToB64(encodeWav(chunks,rate)),mime:'audio/wav'});const text=(j.text||'').trim();
  if(!text){toast("Hech narsa eshitilmadi, qayta urinib ko'ring");return}
  const box=$('#qk');if(box){box.value=text;doQuick()}}
 catch(e){toast(e.message==='VOICE_OFF'?"Ovozli yozish serverda hali yoqilmagan":writeErr(e))}
 finally{const b=$('.qk-mic');b&&b.classList.remove('busy');const i=$('#qk');if(i)i.placeholder=QK_PH}}
function encodeWav(chunks,inRate){const outRate=Math.min(16000,inRate);let len=0;chunks.forEach(c=>len+=c.length);const data=new Float32Array(len);let o=0;chunks.forEach(c=>{data.set(c,o);o+=c.length});
 const ratio=inRate/outRate,n=Math.floor(len/ratio),pcm=new Int16Array(n);
 for(let i=0;i<n;i++){const a=Math.floor(i*ratio),b=Math.min(len,Math.floor((i+1)*ratio));let sum=0,c=0;for(let k=a;k<b;k++){sum+=data[k];c++}const v=Math.max(-1,Math.min(1,c?sum/c:0));pcm[i]=v<0?v*0x8000:v*0x7fff}
 const buf=new ArrayBuffer(44+n*2),dv=new DataView(buf),w=(off,str)=>{for(let i=0;i<str.length;i++)dv.setUint8(off+i,str.charCodeAt(i))};
 w(0,'RIFF');dv.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,outRate,true);dv.setUint32(28,outRate*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,n*2,true);
 new Int16Array(buf,44).set(pcm);return new Blob([buf],{type:'audio/wav'})}
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)})}
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-hold=mic]');if(!b)return;e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}voiceStart(b)});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(VR.on)voiceStop()}));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-hold=mic]'))e.preventDefault()});
document.addEventListener('keydown',e=>{const b=e.target.closest&&e.target.closest('[data-hold=mic]');if(b&&(e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();voiceStart(b)}});
document.addEventListener('keyup',e=>{if(e.target.closest&&e.target.closest('[data-hold=mic]')&&(e.key===' '||e.key==='Enter'))voiceStop()});

 remSms:(d,el)=>{if(!need('remind'))return;const p=S.people[d.id];if(!p)return;const ph=normPhone(p.phone||'');

 remSnooze:(d,el)=>{const t=new Date();t.setDate(t.getDate()+1);t.setHours(6,0,0,0);LS.set('oldiberdi_snooze_'+d.id,String(t.getTime()));const row=$('#rem-'+d.id);if(row)row.remove();render();if(!document.querySelector('.rem-row'))closeSheet()},
 remSettings:()=>{const cur=remDays();const auto=LS.get('oldiberdi_remauto')!=='off';
  openSheet('Eslatma sozlamalari',`<p class="hint" style="margin-top:0">Muddat kiritilmagan qarzlar bo'yicha necha kunda bir eslatish taklif qilinsin?</p><div class="chips" style="flex-wrap:wrap">${[3,7,14,30].map(n=>`<button class="chip ${cur===n?'on':''}" data-act="remDaysSet" data-v="${n}">${n} kun</button>`).join('')}</div>
  <label class="chk" style="margin-top:14px"><input type="checkbox" id="rem-auto" ${auto?'checked':''}> Ilova ochilganda o'zi so'rasin</label>

  else if(d.v==='tg'){window.open('https://t.me/share/url?url='+encodeURIComponent(text),'_blank')}
  else if(d.v==='sms'){location.href='sms:+'+d.ph+'?&body='+encodeURIComponent(text)}
  else if(d.v==='any'){try{await navigator.share({text})}catch(e){return}}
  const c=S.shareCtx;if(c&&c.kind==='remind'&&d.v!=='copy'){const p=S.people[c.pid];if(p){const now=Date.now();const {id,...rest}=p;const item={id,...rest,log:[...(p.log||[]).slice(-29),{at:now,t:'Eslatma yuborildi ('+({tg:'Telegram',sms:'SMS',any:'ulashish'}[d.v])+')'}],updatedAt:now};S.people[id]=item;saveCache();bg('Eslatma tarixi saqlanmadi',()=>api('savePerson',{item}))}}},

 cfMirror:async(d,el)=>{el.disabled=true;el.textContent='Qo\'shilmoqda…';try{await api('mirrorConfirm',{c:CF.c});CF.state='mirrored';drawConfirm()}catch(e){toast(writeErr(e));el.disabled=false}},

 txUnpick:()=>{TX.pid=null;$('#tx-person').innerHTML=personPickHtml();setTimeout(()=>$('#tx-q')?.focus(),50)},

 importContacts:async()=>{const r=await pickContacts(true);if(!r.length)return;let n=0;for(const c of r){if(Object.values(S.people).some(p=>(c.phone&&p.phone===c.phone)||p.name.toLowerCase()===c.name.toLowerCase()))continue;const now=Date.now();try{const j=await api('savePerson',{item:{id:uid(),name:c.name||fphone(c.phone),phone:c.phone,note:'',photo:'',createdAt:now,log:[{at:now,t:'Kontaktdan qo\'shildi'}]}});S.people[j.item.id]=j.item;compute();render();n++}catch(e){toast(writeErr(e));break}}toast(n?`${n} ta odam qo'shildi`:"Hammasi allaqachon ro'yxatda")},
 txView:d=>txView(d.id),
 txEdit:d=>{closeSheet();txForm({id:d.id})},

 newPerson:d=>personForm({name:d.name||'',forTx:d.for==='tx'}),
 editPerson:d=>personForm({id:d.id}),

 viewImg:async d=>{const [k,id]=d.src.split(':');const v0=k==='tx'?S.tx[id]?.photo:S.people[id]?.photo;if(!v0)return;const src=phSrc(v0)||await loadPh(v0);if(!src){toast("Rasmni yuklab bo'lmadi");return}const v=document.createElement('div');v.className='viewer';v.innerHTML=`<img src="${esc(src)}" alt="">`;v.onclick=()=>v.remove();document.body.appendChild(v)},
 rmPhoto:(d,el,e)=>{e.preventDefault();if(d.k==='tx'){TX.photo='';el.closest('.field').querySelector('.photo-pick').outerHTML=photoPickHtml('tx','')}},
 copy:async d=>{try{await navigator.clipboard.writeText(d.v);toast('Raqam nusxalandi')}catch(e){toast(d.v)}},
 editProfile:()=>profileForm(),changePass:()=>passForm(),currency:()=>currencyForm(),
 setCur:async d=>{try{const j=await api('setCurrency',{currency:d.v});setAcc(j.acc);closeSheet();render();toast('Valyuta: '+d.v)}catch(e){toast(writeErr(e))}},
 logout:()=>confirmSheet('Chiqish','Akkauntdan chiqasizmi? Keyin raqam va parol bilan qayta kirasiz.','Chiqish',async()=>{logout()}),
 closeSheet:()=>closeSheet(),
 contactDev:()=>{const ph=normPhone(DEV.phone);openSheet('Dasturchiga murojaat',`<p class="hint" style="margin:0">Ilova bo'yicha savol, taklif yoki muammo bo'lsa, qulay usulni tanlang.</p><div class="copts">${ph?`<a class="copt" href="tel:+${ph}"><span class="qi t-lend">${I.phone}</span><span><b>Qo'ng'iroq qilish</b><small class="num">${fphone(ph)}</small></span><span class="go">${I.left}</span></a>`:''}<a class="copt" href="https://t.me/${esc(DEV.telegram)}" target="_blank" rel="noopener"><span class="qi" style="background:#e2f2fb;color:#1c8fca">${I.send}</span><span><b>Telegram'da yozish</b><small>@${esc(DEV.telegram)}</small></span><span class="go">${I.left}</span></a></div>`)},
 pinKey:d=>{if(S.pinBusy||S.pinBuf.length>=4)return;S.pinBuf+=d.v;S.pinErr='';render();if(S.pinBuf.length===4){S.pinBusy=true;setTimeout(async()=>{try{await pinDone()}finally{S.pinBusy=false}},150)}},
 pinDel:()=>{if(S.pinBusy)return;S.pinBuf=S.pinBuf.slice(0,-1);S.pinErr='';render()},
 bioUnlock:async()=>{if(await bioVerify()){S.locked=false;markAlive();S.pinBuf='';S.pinTries=0;render();maybeNew()}else toast('Barmoq izi tasdiqlanmadi. PIN kodni kiriting.')},
 bioSetup:async()=>{if(await bioEnable())toast('Barmoq izi yoqildi');S.setup=null;render();maybeNew()},
 bioSkip:()=>{S.setup=null;render();toast("PIN kod o'rnatildi");maybeNew()},
 forgotPin:()=>{logout();toast('Telefon raqam va parolingiz bilan kiring')},
 pinCancel:()=>{S.setup=null;S.pinBuf='';S.pinErr='';render()},
 pinSkip:()=>{LS.set('oldiberdi_nopin_'+S.acc.id,'1');S.setup=null;S.pinBuf='';S.pinErr='';render();toast("Mayli. PIN qulfni Profildan istalgan vaqtda qo'yishingiz mumkin");maybeNew()},
 pinOff:()=>{if(!S.acc.pinHash)return;S.setup={step:'cur',mode:'off'};S.pinBuf='';S.pinErr='';render()},
 changePin:()=>{S.setup={step:S.acc.pinHash?'cur':'pin1',mode:'change'};S.pinBuf='';S.pinErr='';render()},
 toggleBio:async()=>{if(bioGet()){LS.del('oldiberdi_bio');toast("Barmoq izi o'chirildi")}else if(await bioEnable())toast('Barmoq izi yoqildi');render()},
 lockNow:()=>{if(!S.acc.pinHash)return;S.locked=true;clearAlive();S.pinBuf='';S.pinErr='';render()},
 setAva:async(d,el)=>{const t=S.tx[d.id];if(!t)return;el.disabled=true;if(await touchPerson(t.pid,t.photo,true)){el.remove();toast('Profil rasmi qo\'yildi')}else el.disabled=false},
 reloadApp:(d,el)=>{el.disabled=true;el.textContent='Yuklanmoqda…';let done=false;const go=()=>{if(done)return;done=true;location.reload()};const c=navigator.serviceWorker&&navigator.serviceWorker.controller;if(!c)return go();const ch=new MessageChannel();ch.port1.onmessage=go;c.postMessage('refresh',[ch.port2]);setTimeout(go,6000)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==='BUTTON'&&el.type!=='submit')e.preventDefault();f(el.dataset,el,e)});
document.addEventListener('change',e=>{if(e.target.id==='rem-auto'){LS.set('oldiberdi_remauto',e.target.checked?'on':'off');render()}if(e.target.id==='tx-plan-on'&&TX&&e.target.checked&&!TX.planOn&&locked('plan')){e.target.checked=false;premSheet('plan');return}if(e.target.id==='tx-plan-on'&&TX){TX.planOn=e.target.checked;const b=$('#tx-plan-box');if(b)b.hidden=!TX.planOn;syncDue()}});
document.addEventListener('submit',e=>{e.preventDefault();const k=e.target.dataset.form;({quick:doQuick,login:doLogin,register:doRegister,tx:saveTx,person:savePerson,profile:saveProfile,pass:savePass,item:addItem,listNew:saveListNew,itemEdit:saveItemEdit,listRename:saveListRename,toy:saveToy,toyItem:addToyItem,kid:saveKid,kidGive:saveKidGive,kidLogin:doKidLogin,kTx:saveKTx,kGoal:saveKGoal,kName:saveKName,toyItemSave:saveToyItem,gift:saveGift,loan:saveLoan,grp:saveGrp,grpMember:addMember,gmSave:saveGm,biz:saveBiz})[k]?.(e.target)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.input==='pq'){S.pq=t.value;render._focus='pq';render()}
 else if(t.dataset.input==='hq'){S.hq=t.value;render._focus='hq';render()}
 else if(t.dataset.input==='tq'){S.tq=t.value;render._focus='tq';render()}
 else if(t.dataset.input==='txq'){$('#tx-sugg').innerHTML=suggHtml(t.value)}
 if(t.hasAttribute('data-plan')){setTimeout(()=>{planPreview();convHint()},0)}
 if(t.hasAttribute('data-amount')){let v=t.value.replace(/[^\d.,]/g,'').replace('.',',');const [i,...f]=v.split(',');const ii=i.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,' ');t.value=ii+(f.length?','+f.join('').slice(0,2):'')}
});
document.addEventListener('keydown',e=>{if(S.acc&&(S.locked||S.setup)&&!sheets.length){if(/^\d$/.test(e.key)){A.pinKey({v:e.key});return}if(e.key==='Backspace'){A.pinDel();return}}if(e.key==='Escape'){const v=$('.viewer');if(v)v.remove();else closeSheet()}if(e.key==='Enter'&&e.target.id==='tx-q'){e.preventDefault();const first=$('#tx-sugg [data-act]');first&&first.click()}});
document.addEventListener('change',async e=>{const t=e.target;const k=t.dataset.photo;if(!k||!t.files||!t.files[0])return;
 try{const url=await compressImage(t.files[0]);
  if(k==='tx'){TX.photo=url;t.closest('.photo-pick').outerHTML=photoPickHtml('tx',url)}
  else if(k==='person'){PD.photo=url;$('#ph-person').innerHTML=avatar({photo:url},88)}
  else if(k==='kid'){kidPhotoSave(url)}
  else if(k==='profile'){PR.photo=url;$('#ph-profile').innerHTML=avatar({photo:url},88)}
 }catch(err){toast("Rasmni o'qib bo'lmadi")}});

(async function boot(){
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 await bioCheck();
 if(!API_URL){$('#app').innerHTML=`<div class="auth"><div class="auth-top pad">${LOGO}<h1>Oldi<span>-</span>Berdi</h1><p>Ilova hali serverga ulanmagan.</p></div><div class="pad"><div class="auth-card"><b>Sozlash kerak</b><p class="hint">GitHub'dagi <b>config.js</b> faylini oching va Google Apps Script'dan olgan havolani qo'shtirnoq ichiga yozing.</p></div></div></div>`;return}
 {const rp=new URLSearchParams(location.search).get('remind');if(rp){S.remindParam=rp;try{history.replaceState(null,'',location.pathname)}catch(e){}}}
 if(new URLSearchParams(location.search).get('pay')){try{history.replaceState(null,'',location.pathname)}catch(e){}}
 const cParam=new URLSearchParams(location.search).get('c');
 if(cParam){renderConfirm(cParam);return}
 let a=null;try{a=JSON.parse(LS.get('oldiberdi_acc')||'null')}catch(e){}
 {const ks=kidSess();if(ks&&ks.token&&ks.kid){startKid(ks);return}}
 if(S.token&&a&&a.id){startSession(a,true);return}
 renderAuth();
})();
